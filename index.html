<style>
  :root{
    --ink:#0B1420;
    --raised:#121F2D;
    --rule:#20344A;
    --vellum:#E9E1D0;
    --dim:#8194AB;
    --ember:#E0343A;
    --gold:#3F91E4;
    --siluet:#1E4066;
    --sonuk:#5D6F88;
    --okundu1:#9BA9B9;
    --okundu2:#7E8CA0;
    --uyari:#E08878;
    --yazar:#94A3B4;
    --ozet:#BCC8D6;
    --kapak-yazi:#31527A;
    --kapak1:#162535;
    --kapak2:#101C29;
    --sil:#4A5B71;
    color-scheme:dark;

    --serif:"Newsreader",Georgia,serif;
    --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;

    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  :root[data-tema="acik"]{
    --ink:#F4F0E6;
    --raised:#FFFFFF;
    --rule:#DDD5C4;
    --vellum:#15202D;
    --dim:#5C697A;
    --ember:#C42A31;
    --gold:#1E68BC;
    --siluet:#CAD6E4;
    --sonuk:#8A94A1;
    --okundu1:#7A8594;
    --okundu2:#8A94A1;
    --uyari:#B4432E;
    --yazar:#5C697A;
    --ozet:#2E3A48;
    --kapak-yazi:#9AAAC0;
    --kapak1:#E9E3D6;
    --kapak2:#DFD7C7;
    --sil:#A4AEBA;
    color-scheme:light;
  }
  *,*::before,*::after{box-sizing:inherit}
  html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
  body{
    margin:0;min-height:100%;background:var(--ink);color:var(--vellum);
    font-family:var(--sans);font-size:16px;line-height:1.5;padding-bottom:78px;
  }
  button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
  a{color:inherit}
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:2px}

  .masthead{
    position:relative;overflow:hidden;
    padding:15px 18px 16px;border-bottom:1px solid var(--rule);background:var(--ink);
  }
  .siluet{
    position:absolute;right:-6px;bottom:-5px;width:76%;max-width:342px;height:auto;
    color:var(--siluet);opacity:.9;pointer-events:none;
  }
  .bas{position:relative;display:flex;align-items:center;gap:11px}
  .mark{width:36px;height:46px;flex:none}
  .wordmark{font-family:var(--serif);font-size:clamp(18px,5.6vw,22px);font-weight:600;line-height:1;white-space:nowrap}
  .wordmark em{font-style:normal;color:var(--gold)}
  .wordmark .tef{font-style:normal;color:var(--ember)}
  .tema-dugme{margin-inline-start:auto;flex:none;width:36px;height:36px;border-radius:50%;border:1px solid var(--rule);
    display:flex;align-items:center;justify-content:center;color:var(--dim);background:var(--ink)}
  .tema-dugme svg{width:18px;height:18px}
  .sayaclar{position:relative;margin-top:7px;display:flex;gap:9px;padding-inline-start:47px}
  .count{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}

  .rail{display:flex;gap:8px;overflow-x:auto;padding:11px 18px;
    border-bottom:1px solid var(--rule);scrollbar-width:none;-webkit-overflow-scrolling:touch;
    position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ink)}
  .rail::-webkit-scrollbar{display:none}
  .ust-serit{position:fixed;left:0;right:0;top:0;z-index:40;height:calc(56px + env(safe-area-inset-top,0px));
    padding:env(safe-area-inset-top,0px) 16px 0;display:flex;align-items:center;gap:9px;cursor:pointer;
    background:#16427B url(dunya-gece.jpg) center 46%/cover no-repeat;
    background-image:image-set(url(dunya-gece.webp) type("image/webp"), url(dunya-gece.jpg) type("image/jpeg"));
    border-bottom:1px solid rgba(255,255,255,.08);box-shadow:0 6px 18px rgba(0,0,0,.28);
    transform:translateY(-105%);transition:transform .28s ease;will-change:transform}
  .ust-serit::before{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(90deg,rgba(6,14,32,.74) 0%,rgba(6,14,32,.3) 48%,rgba(6,14,32,0) 100%)}
  .ust-serit > *{position:relative}
  .ust-serit img.mark{width:26px;height:33px;object-fit:contain}
  .ust-serit .wordmark{font-size:17px;color:#F4EFE3;text-shadow:0 1px 6px rgba(0,8,24,.75)}
  .ust-serit .wordmark em{color:#8CC6FF} .ust-serit .wordmark .tef{color:#FF6166}
  :root[data-tema="acik"] .ust-serit{background-color:#B4D3EB;
    background-image:image-set(url(dunya-gunduz.webp) type("image/webp"), url(dunya-gunduz.jpg) type("image/jpeg"));
    border-bottom-color:rgba(15,35,64,.12);box-shadow:0 6px 18px rgba(15,35,64,.14)}
  :root[data-tema="acik"] .ust-serit::before{background:linear-gradient(90deg,rgba(244,239,227,.8) 0%,rgba(244,239,227,.35) 48%,rgba(244,239,227,0) 100%)}
  :root[data-tema="acik"] .ust-serit .wordmark{color:#0F2340;text-shadow:0 1px 6px rgba(244,239,227,.9)}
  :root[data-tema="acik"] .ust-serit .wordmark em{color:#0E5FB8}
  :root[data-tema="acik"] .ust-serit .wordmark .tef{color:#C21F28}
  body.serit-acik .ust-serit{transform:none}
  body.serit-acik .rail{top:calc(env(safe-area-inset-top,0px) + 56px)}
  .chip{flex:none;padding:5px 12px;border:1px solid var(--rule);border-radius:999px;
    font-size:13px;color:var(--dim);white-space:nowrap}
  .chip[aria-pressed="true"]{border-color:var(--ember);color:var(--vellum);background:rgba(224,52,58,.16)}
  .chip .say{font-size:10.5px;opacity:.65;margin-left:5px;font-variant-numeric:tabular-nums}
  .chip.bos{opacity:.4}

  .arama{display:flex;align-items:center;gap:9px;padding:10px 18px;border-bottom:1px solid var(--rule)}
  .arama svg{width:17px;height:17px;flex:none;color:var(--dim)}
  .arama input{flex:1;min-width:0;background:none;border:none;color:var(--vellum);
    font-family:var(--sans);font-size:15px;padding:4px 0;outline:none}
  .arama input::placeholder{color:var(--sonuk)}
  .arama input::-webkit-search-cancel-button{display:none}
  .arama #qsil{flex:none;color:var(--dim);font-size:20px;line-height:1;padding:2px 6px}
  .katlar{padding:10px 18px 9px;border-bottom:1px solid var(--rule);position:static}
  .katlar .chip{font-family:var(--serif);font-size:14.5px;padding:5px 14px;
    letter-spacing:.01em}
  .katlar .chip[aria-pressed="true"]{border-color:var(--gold);color:var(--vellum);
    background:rgba(63,145,228,.14)}
  .etiketler{padding:9px 18px}
  .etiketler .chip{font-size:12.5px;padding:4px 11px}
  main{padding:0 18px}
  .entry{padding:19px 0;border-bottom:1px solid var(--rule)}
  .entry.okundu h2{color:var(--okundu1)}
  .entry.okundu .sum{color:var(--okundu2)}
  .cubuk{display:flex;gap:9px;align-items:center;padding:12px 0 2px;flex-wrap:wrap}
  .mini{border:1px solid var(--rule);border-radius:999px;padding:6px 14px;font-size:12.5px;color:var(--dim)}
  .mini[disabled]{opacity:.5}
  .uyari{font-size:12px;color:var(--uyari)}
  .daha{padding:22px 0 10px;text-align:center}
  .daha .son{font-size:12px;color:var(--sonuk)}
  .entry:last-child{border-bottom:none}
  .meta{display:flex;align-items:baseline;gap:10px;margin-bottom:7px}
  .src{font-size:11.5px;font-weight:600;letter-spacing:.06em;color:var(--ember);white-space:nowrap}
  .yazar{font-size:11.5px;color:var(--yazar);font-style:italic;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;max-width:46%}
  .when{font-size:11.5px;color:var(--dim);margin-inline-start:auto;white-space:nowrap;font-variant-numeric:tabular-nums}
  .govde{display:flex;gap:13px;align-items:flex-start}
  .yazi{flex:1;min-width:0}
  .kapak{width:86px;height:86px;object-fit:cover;border-radius:7px;flex:none;
    background:var(--raised);border:1px solid var(--rule);margin-top:2px}
  .kapak.yer{display:flex;align-items:center;justify-content:center;
    font-family:var(--serif);font-size:34px;line-height:1;color:var(--kapak-yazi);
    background:linear-gradient(158deg,var(--kapak1) 0%,var(--kapak2) 100%)}
  .entry h2{font-family:var(--serif);font-weight:500;font-size:19px;line-height:1.32;margin:0 0 7px}
  .orig{font-size:13px;color:var(--dim);font-style:italic;margin:0 0 8px}
  .sum{font-family:var(--serif);font-size:15px;line-height:1.55;color:var(--ozet);margin:0 0 12px}
  .acts{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
  .act{font-size:13px;color:var(--dim);display:flex;align-items:center;gap:5px}
  .act svg{width:15px;height:15px;flex:none}
  .act.on{color:var(--gold)}
  .act.busy{opacity:.5}

  .state{padding:52px 6px;text-align:center;color:var(--dim)}
  .state .mark{width:68px;height:87px;opacity:.85;margin:0 auto 20px}
  .state h3{font-family:var(--serif);font-weight:500;font-size:20px;color:var(--vellum);margin:0 0 10px}
  .state p{font-size:14.5px;margin:0 0 14px;line-height:1.6;max-width:33em;margin-left:auto;margin-right:auto}
  .state .go{border:1px solid var(--rule);padding:9px 18px;border-radius:999px;font-size:14px;color:var(--vellum);margin:6px 4px 0}
  .warn{color:var(--uyari);font-size:13px;line-height:1.55;padding:12px 0;border-bottom:1px solid var(--rule);margin-bottom:4px}

  .grupbas{font-family:var(--serif);font-size:13px;font-weight:500;color:var(--ember);
    letter-spacing:.07em;text-transform:uppercase;margin:26px 0 2px;padding-bottom:5px;
    border-bottom:1px solid var(--rule)}
  .ac{display:block;width:100%;text-align:center;padding:12px;margin:16px 0 4px;
      border:1px solid var(--rule);border-radius:9px;font-size:14px;color:var(--dim)}
  .ac[aria-expanded="true"]{color:var(--vellum)}
  .srow{display:flex;align-items:center;gap:14px;padding:16px 2px;border-bottom:1px solid var(--rule)}
  .sinfo{min-width:0;flex:1}
  .durum{font-size:11.5px;color:var(--dim);margin-top:3px;display:flex;gap:9px;align-items:baseline}
  .durum.kirik{color:var(--uyari)}
  .durum .alan{color:var(--sonuk);margin-inline-start:auto;font-size:11px}
  .srow .nm{font-family:var(--serif);font-size:17px;line-height:1.25}
  .srow .tog{flex:none;width:42px;height:25px;border-radius:999px;background:var(--rule);position:relative}
  .srow .tog::after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:var(--dim)}
  .srow .tog[aria-pressed="true"]{background:rgba(224,52,58,.35)}
  .srow .tog[aria-pressed="true"]::after{left:20px;background:var(--ember)}
  .srow .del{flex:none;color:var(--sil);font-size:20px;line-height:1;padding:4px 2px}
  .addbox{padding:14px 0 18px;border-bottom:1px solid var(--rule)}
  .addbox input{width:100%;background:var(--raised);border:1px solid var(--rule);color:var(--vellum);
    padding:11px 13px;border-radius:7px;font-size:15px;margin-bottom:9px;font-family:var(--sans)}
  .addbox input::placeholder{color:var(--sonuk)}
  .addbox .save{background:var(--ember);color:#fff;padding:10px 20px;border-radius:7px;font-size:14.5px;font-weight:500}
  .note{font-size:13px;color:var(--dim);line-height:1.65;padding:18px 0 4px}

  nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;
    background:var(--raised);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px)}
  nav button{flex:1;padding:11px 0 12px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--dim);font-size:11px}
  nav button svg{width:21px;height:21px}
  nav button[aria-current="page"]{color:var(--vellum)}
  nav button[aria-current="page"] svg{color:var(--ember)}

  /* paylasilan yazi */
  .acilan{margin:14px 0 4px;padding:15px 16px 14px;border:1px solid var(--rule);border-radius:12px;background:var(--raised)}
  .acilan .ust{display:flex;align-items:center;justify-content:space-between;margin:-2px 0 8px}
  .acilan .etk{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}
  .acilan .kapat{font-size:24px;line-height:1;color:var(--dim);padding:0 2px 2px 10px}
  .acilan .meta{flex-wrap:wrap;row-gap:3px}
  .acilan .kimlik{font-size:11.5px;color:var(--dim);order:3;flex-basis:100%}
  .acilan .buyuk{display:block;width:100%;max-height:230px;object-fit:cover;border-radius:8px;margin:4px 0 13px;border:1px solid var(--rule)}
  .acilan h2{font-family:var(--serif);font-weight:500;font-size:22px;line-height:1.3;margin:0 0 7px}
  .acilan .yz{font-size:13px;color:var(--yazar);font-style:italic;margin:0 0 8px}
  .dugmeler{display:flex;gap:10px;flex-wrap:wrap;margin:4px 0 14px}
  .dugme{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:999px;border:1px solid var(--rule);
    font-size:14px;text-decoration:none;color:var(--vellum)}
  .dugme svg{width:15px;height:15px;flex:none}
  .dugme.ana{background:var(--ember);border-color:var(--ember);color:#fff}

  /* Tefekkur */
  .tef-giris{padding:22px 0 8px;border-bottom:1px solid var(--rule)}
  .tef-giris h3{font-family:var(--serif);font-weight:500;font-size:23px;margin:0 0 8px}
  .tef-giris p{font-family:var(--serif);font-size:15.5px;line-height:1.6;color:var(--ozet);margin:0 0 12px}
  .tef-kart{display:block;padding:19px 0;border-bottom:1px solid var(--rule);text-decoration:none;color:inherit}
  /* Tefekkür yazısı uygulamanın içinde okunur: başlık, panorama ve kaydırma şeridi yerinde kalır */
  .tef-oku{padding:18px 0 8px}
  .tef-entry .yazi{cursor:pointer}
  .tef-oku .tef-acts{margin:4px 0 22px;padding:10px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
  .tef-oku .tef-metin > .tef-acts:last-child{margin-top:26px}
  .tef-geri{background:none;border:0;padding:6px 0;margin:0 0 6px;color:var(--dim);font:500 14px var(--sans);cursor:pointer}
  .tef-oku .tarih{font:12.5px var(--serif);color:var(--dim);margin:6px 0 10px}
  .tef-oku h1{font-family:var(--serif);font-weight:500;font-size:clamp(26px,7vw,34px);line-height:1.2;margin:0 0 10px;color:var(--vellum)}
  .tef-oku .yazar-satir{font:14px/1.5 var(--sans);color:var(--dim);margin:0 0 22px}
  .tef-oku .yazar-satir strong{font-weight:600;color:var(--ember)}
  .tef-oku .slogan{font-family:var(--serif);font-style:italic;font-size:19px;color:var(--ozet);margin:0 0 14px}
  .tef-oku p{font-family:var(--serif);font-size:17.5px;line-height:1.78;color:var(--ozet);margin:0 0 18px}
  .tef-oku .misra{margin:24px 0;line-height:1.95}
  .tef-oku .imza{margin:32px 0 10px;text-align:center;letter-spacing:.04em}
  .tef-oku .imza strong{display:block;font:600 14px var(--sans);letter-spacing:.1em;color:var(--vellum)}
  .tef-oku .imza em{display:block;margin-top:6px}
  .tef-kart .yz{font-size:11.5px;font-weight:600;letter-spacing:.05em;color:var(--ember)}
  .tef-kart h2{font-family:var(--serif);font-weight:500;font-size:20px;line-height:1.3;margin:6px 0 7px}
  .alt-baglantilar{padding:28px 0 10px;font-size:12.5px;color:var(--sonuk);text-align:center}
  .alt-baglantilar a{color:var(--dim);text-decoration:none;margin:0 9px}

  .ayar{padding:16px 0 14px;border-bottom:1px solid var(--rule)}
  .ayar-bas{font-family:var(--serif);font-size:13px;font-weight:500;color:var(--ember);letter-spacing:.07em;
    text-transform:uppercase;margin-bottom:6px}
  .ayar-satir{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 0;font-size:15px}
  .ayar-satir select{background:var(--raised);color:var(--vellum);border:1px solid var(--rule);border-radius:8px;
    padding:7px 10px;font-family:var(--sans);font-size:14px;max-width:62%}
  .ayar-not{font-size:12.5px;line-height:1.55;color:var(--dim);margin:6px 0 0}

  /* baslik: dunya manzarasi (koyu temada gece, acik temada gunduz) */

  :root[data-tema="acik"] .masthead{background:#B4D3EB url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAMgAAAABCAIAAAAU3Xa1AAAAeUlEQVR42o2RUQ6AMAhD2/vf0CP467/PDxFhm4kk25rCWsa87YemIFYAbpKyJw8tGwBurKhANZvATb+aZidUTGX5SufRfEnfuavRlzYNCyGLwMU3BU89Oz5VlJVXQ4xhzsN7tYo1O9JLnXTn44v/hDuwYyyW5Ddbay4sxm1crtic1QAAAABJRU5ErkJggg==) 0 0/100% 100% no-repeat}

/* ---------- Tek dil: arayüz ve çeviri aynı dilde. Türkçe ve İngilizce dışındaki dillerde arayüz,
   İngilizce metinlerin makine çevirisiyle gösterilir; sonuç telefonda saklanır ---------- */
const MT_DOKUNMA = new Set(["nav_idrak","nav_tefekkur"]);      // marka adları çevrilmez
function arayuzKaynagi(){
  const liste = [];
  for(const [k,v] of Object.entries(SOZLUK.en)){
    if(MT_DOKUNMA.has(k)) continue;
    let m; try{ m = typeof v === "function" ? v("{0}","{1}","{2}") : v; }catch(e){ continue; }
    if(typeof m !== "string" || !m.trim() || m.includes("\n")) continue;
    liste.push([k, m]);
  }
  return liste;
}
const metinOzeti = s => { let h = 5381; for(let i=0;i<s.length;i++) h = ((h<<5)+h+s.charCodeAt(i))|0; return (h>>>0).toString(36); };
const arayuzSurumu = () => metinOzeti("2|" + arayuzKaynagi().map(x=>x[0]+"="+x[1]).join("|"));   // 2: satır eşleme yenilendi, eski yarım çeviriler yenilensin
function mtKur(metin){
  const sonuc = {};
  for(const [k,m] of Object.entries(metin||{})){
    const asil = SOZLUK.en[k];
    if(typeof asil === "function"){
      let bek = 0; try{ bek = (asil("{0}","{1}","{2}").match(/\{\d\}/g)||[]).length; }catch(e){}
      if((m.match(/\{\d\}/g)||[]).length === bek) sonuc[k] = (...a) => m.replace(/\{(\d)\}/g, (_,i) => a[+i] ?? "");
    } else sonuc[k] = m;
  }
  return sonuc;
}
async function arayuzuHazirla(kod){
  if(SOZLUK[kod]){ S.arayuzMT = {}; return; }
  const liste = arayuzKaynagi(), surum = arayuzSurumu();
  const sakli = yukle("ti.arayuzMT", null);
  if(sakli && sakli.kod===kod && sakli.surum===surum){ S.arayuzMT = mtKur(sakli.metin); return; }
  S.arayuzMT = {};
  const parcalar = []; let p = [], uz = 0;
  for(const x of liste){ if(uz + x[1].length > 700 && p.length){ parcalar.push(p); p = []; uz = 0; } p.push(x); uz += x[1].length + 1; }
  if(p.length) parcalar.push(p);
  const metin = {};
  try{
    for(const parca of parcalar){
      const r = await fetch("https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl="
        + encodeURIComponent(kod) + "&dt=t&q=" + encodeURIComponent(parca.map(x=>x[1]).join("\n")));
      if(!r.ok) throw new Error("çeviri " + r.status);
      const j = await r.json();
      // Google çeviriyi bölüt bölüt döndürür; her bölütün aslı da yanında gelir. Aslı satır sonuyla bitince satır biter.
      const satir = []; let tampon = "";
      for(const s of (j[0]||[])){
        if(!s) continue;
        tampon += String(s[0]||"").replace(/\n/g, " ");
        if(String(s[1]||"").endsWith("\n")){ satir.push(tampon.trim()); tampon = ""; }
      }
      if(tampon.trim()) satir.push(tampon.trim());
      if(satir.length !== parca.length) continue;       // yine de kaydıysa bu parça İngilizce kalır
      parca.forEach((x,i) => { const s = satir[i]; if(s) metin[x[0]] = s; });
    }
  }catch(e){ /* çeviri kapısı yanıt vermezse arayüz İngilizce kalır */ }
  if(S.dil !== kod) return;
  if(Object.keys(metin).length){ yaz("ti.arayuzMT", {kod, surum, metin}); S.arayuzMT = mtKur(metin); }
}

function serpistir(liste){
  const sonuc=[], bekleyen=[];
  let son=null, ardisik=0;
  const ekle = y => {
    if(y.kaynak===son) ardisik++; else { son=y.kaynak; ardisik=1; }
    sonuc.push(y);
  };
  for(const y of liste){
    if(y.kaynak===son && ardisik>=2){ bekleyen.push(y); continue; }
    ekle(y);
    const i = bekleyen.findIndex(b=>b.kaynak!==son);
    if(i>-1) ekle(bekleyen.splice(i,1)[0]);
  }
  return sonuc.concat(bekleyen);
}

function nezaman(x){
  const d = tarihOku(x); if(!d) return "";
  const dk = Math.floor((Date.now()-d)/60000);
  let rtf; try{ const dl = Intl.RelativeTimeFormat.supportedLocalesOf([S.arayuz]).length ? S.arayuz : "en";
    rtf = new Intl.RelativeTimeFormat(dl, {numeric:"auto"}); }catch(e){ rtf = null; }
  if(dk < 1) return t("az_once");
  if(!rtf) return d.toLocaleDateString(S.arayuz);
  if(dk < 60) return rtf.format(-dk, "minute");
  const sa = Math.floor(dk/60); if(sa < 24) return rtf.format(-sa, "hour");
  const g = Math.floor(sa/24);
  if(g < 30) return rtf.format(-g, "day");
  return d.toLocaleDateString(S.arayuz, {day:"numeric", month:"long"});
}

async function akisiCek(){

async function cek(){
  if(S.yukleniyor) return;
  S.yukleniyor=true; S.hata=[];

  bellektenTopla();
  const vardi = S.yazilar.length>0;
  if(!vardi && S.ekran==="feed"){
    cizSerit();
    $("#feed").innerHTML=`<div class="state">
      <img class="mark" src="logo-seffaf.png" alt="" aria-hidden="true">
      <p>${t("akis_aliniyor")}</p></div>`;
  }
  const g=$("#tazele"); if(g) g.textContent="…";

  try{
    const veri = await akisiCek();
    S.guncellendi = veri.guncellendi;

    S.tum = new Map();
    for(const [ad, kayit] of Object.entries(veri.kaynaklar||{})){
      S.bilgi[ad] = {ulke:kayit.ulke||"", nitelik:kayit.nitelik||"", kimlik:kayit.kimlik||"", dil:kayit.dil||""};
      for(const y of (kayit.yazilar||[])){ if(y.pay) S.tum.set(y.pay, y); S.tum.set(y.id, y); }
      const mevcut = S.kaynaklar.find(k=>k.ad===ad);
      if(mevcut) mevcut.tur = kayit.tur || mevcut.tur || "kurum";
      else S.kaynaklar.push({ad, url:"", acik:true, sunucu:true, tur:kayit.tur||"kurum"});
      S.bellek[ad] = {yazilar:(kayit.yazilar||[]).filter(taze).slice(0,70), zaman:Date.parse(kayit.tarandi)||Date.now()};
      if(kayit.durum && kayit.durum!=="tamam") S.hata.push({ad, mesaj:kayit.durum});
    }
    // sunucunun artik taramadigi eski kaynaklar listeden kalksin (kapanan, adi degisen)
    const sunucuda = new Set(Object.keys(veri.kaynaklar||{}));
    if(sunucuda.size){
      S.kaynaklar = S.kaynaklar.filter(k=>sunucuda.has(k.ad));
      for(const ad of Object.keys(S.bellek)) if(!sunucuda.has(ad)) delete S.bellek[ad];
      if(S.suzgec!=="hepsi" && !sunucuda.has(S.suzgec)) S.suzgec="hepsi";
    }
    yaz("ti.kaynaklar6", S.kaynaklar);
    // cevrimdisi icin kucuk kopya: telefonun deposu dolmasin diye kaynak basina 40 yazi
    yaz("ti.bellek", Object.fromEntries(Object.entries(S.bellek).map(([ad,v]) => [ad, {...v, yazilar:(v.yazilar||[]).slice(0,40)}])));
  }catch(e){
    S.hata.push({ad:t("nav_idrak"), mesaj:e.message});
  }

  bellektenTopla();
  S.yukleniyor=false;
  if(g) g.textContent="";
  // paylasilan baglantidan gelindiyse yazinin tam halini yerlestir
  if(ACILIS && S.acilan){
    const tam = S.tum.get(ACILIS);
    if(tam && (S.acilan.pay===tam.pay || S.acilan.id===tam.id)) S.acilan = tam;
  } else if(ACILIS && !S.acilanKapandi){
    const y = paylasilaniBul(ACILIS);
    if(y){ yaziyiAc(y); return; }
  }
  ciz();
}

  return {baslik:b.metin, ozet:o.metin, dil:hedef, kd:kok(b.dil), ayni: !!b.dil && kok(b.dil)===kok(hedef)};

function ceviriSakla(id, c){
  S.ceviri[id] = c;
  const an=Object.keys(S.ceviri); if(an.length>400) an.slice(0,an.length-400).forEach(x=>delete S.ceviri[x]);
}
/* Çeviriden sonra bütün ekranı yeniden çizmek yerine yalnız o kartın metnini ve düğmelerini değiştir.
   Görsel yeniden yüklenmez, sayfa kıpırdamaz. */
function kartiYenile(id){
  const y = [...S.yazilar,...S.kayitli,...tefOgeleri()].find(x=>x.id===id);
  if(!y) return;
  document.querySelectorAll(`article.entry [data-kay="${id}"]`).forEach(b=>{
    const eski = b.closest("article.entry"); if(!eski) return;
    const gecici = document.createElement("div"); gecici.innerHTML = y.tef ? tefKart(y, false) : kart(y);
    const yeni = gecici.firstElementChild; if(!yeni) return;
    for(const s of [".yazi",".acts"]){ const a=eski.querySelector(s), c=yeni.querySelector(s); if(a&&c) a.innerHTML=c.innerHTML; }
  });
}
const ekrandakiler = () => [...document.querySelectorAll("#feed article.entry [data-kay]")]
  .map(b=>S.yazilar.find(y=>y.id===b.dataset.kay)).filter(Boolean);
function topluDugmesi(){
  const d = document.querySelector("[data-toplu]"); if(!d) return;
  const kalan = ekrandakiler().filter(cevrilmeli).length;
  if(S.topluCeviri){ d.disabled = true; d.textContent = t("cevriliyor_n", S.topluKalan||0); }
  else if(!kalan){ d.remove(); }
  else { d.disabled = false; d.textContent = t("hepsini_cevir", sayi(kalan)); }
}

async function yaziyiCevir(id){
  const y = [...S.yazilar,...S.kayitli,S.acilan,...tefOgeleri()].filter(Boolean).find(x=>x.id===id);
  if(!y || !cevrilmeli(y)) return;
  const d = document.querySelector(`[data-cev="${id}"]`);
  if(d){ d.classList.add("busy"); d.lastElementChild.textContent = t("cevriliyor"); }
  try{
    ceviriSakla(id, await ikisiniCevir(y));
    yaz("ti.ceviri", S.ceviri);
    if(S.acilan && S.acilan.id===id) ciz(); else { kartiYenile(id); topluDugmesi(); }
  }catch(e){
    if(d){ d.classList.remove("busy"); d.lastElementChild.textContent = t("ceviri_kapali"); }
  }
}
function orijinaliGoster(id){
  delete S.ceviri[id]; yaz("ti.ceviri", S.ceviri);
  if(S.acilan && S.acilan.id===id) ciz(); else { kartiYenile(id); topluDugmesi(); }
}

async function hepsiniCevir(){
  if(S.topluCeviri) return;
  S.otoCeviri = true;                       // bu oturumda yeni görünen yazılar da çevrilsin
  const liste = ekrandakiler().filter(cevrilmeli);
  if(!liste.length){ topluDugmesi(); return; }
  S.topluCeviri = true; S.topluKalan = liste.length; topluDugmesi();
  for(let i=0; i<liste.length; i+=3){
    const grup = liste.slice(i, i+3);
    try{
      const sonuc = await Promise.all(grup.map(ikisiniCevir));
      grup.forEach((y,k)=>{ ceviriSakla(y.id, sonuc[k]); kartiYenile(y.id); });
    }catch(e){ S.otoCeviri = false; break; }   // çeviri kapısı yanıt vermezse dur, zorlama
    S.topluKalan = Math.max(0, liste.length-i-grup.length); topluDugmesi();
    await new Promise(r=>setTimeout(r,150));
  }
  S.topluCeviri = false; S.topluKalan = 0;
  yaz("ti.ceviri", S.ceviri); topluDugmesi();
}

/* ---------- Kaydetme ---------- */
function kaydet(id){
  const i = S.kayitli.findIndex(x=>x.id===id);
  if(i > -1) S.kayitli.splice(i,1);
  else { const y = S.yazilar.find(x=>x.id===id) || (S.acilan && S.acilan.id===id ? S.acilan : null) || tefOgeleri().find(x=>x.id===id); if(y) S.kayitli.unshift(y); }
  if(S.kayitli.length>300) S.kayitli.length=300;
  yaz("ti.kayitli", S.kayitli); ciz();
}
const kayitliMi = id => S.kayitli.some(x=>x.id===id);

/* Paylasilan baglanti her zaman bizim adresimiz: once Turkan Idrak Tefekkur acilir,
   kaynak oradan okunur. Kart onizlemesi y/<kod>/ sayfasindan gelir. */
function paylasimAdresi(y){
  const taban = new URL("./", location.href).href.split("?")[0].split("#")[0];
  if(y.tef) return taban + y.tef;   // Tefekkür: yazının kendi sayfası (önizleme için), açınca uygulamanın içine yönlenir
  return y.pay ? taban+"y/"+y.pay+"/" : taban+"?y="+encodeURIComponent(y.id);
}
async function paylas(id, dugme){
  const y = [...S.yazilar, ...S.kayitli, S.acilan, ...tefOgeleri()].filter(Boolean).find(x=>x.id===id);
  if(!y) return;
  const c = trOf(y);
  const baslik = c ? c.baslik : y.baslik;
  const adres = paylasimAdresi(y);
  try{
    const imza = y.tef ? y.yazar + " · Türkan İdrak Tefekkür" : kaynakAdi(y.kaynak);
    if(navigator.share){ await navigator.share({title:baslik, text:baslik+" — "+imza, url:adres}); return; }
    await navigator.clipboard.writeText(baslik+" — "+imza+"\n"+adres);
    if(dugme){ const e=dugme.lastElementChild; e.textContent=t("kopyalandi"); setTimeout(()=>e.textContent=t("paylas"),1600); }
  }catch(e){ /* kullanici vazgecti */ }
}
function okunduIsaretle(id){
  if(S.okunan.includes(id)) return;
  S.okunan.push(id);
  if(S.okunan.length>600) S.okunan.splice(0,S.okunan.length-600);
  yaz("ti.okunan", S.okunan);
}

/* ---------- Paylasilan yazi ---------- */
function paylasilaniBul(kod){
  if(!kod) return null;
  const y = S.tum.get(kod) || [...S.yazilar, ...S.kayitli].find(x=>x.pay===kod || x.id===kod);
  if(y) return y;
  try{
    const v = JSON.parse(sessionStorage.getItem("ti.paylasilan")||"null");
    if(v && (v.pay===kod || v.id===kod)){ if(v.kb && !S.bilgi[v.kaynak]) S.bilgi[v.kaynak]=v.kb; return v; }
  }catch(e){}
  return null;
}
function yaziyiAc(y){
  S.acilan = y; S.ekran = "feed";
  try{ history.replaceState(null, "", "?y="+encodeURIComponent(y.pay||y.id)); }catch(e){}
  ciz(); scrollTo({top:0});
}
function yaziyiKapat(){
  S.acilan = null; S.acilanKapandi = true;
  try{ history.replaceState(null, "", location.pathname); }catch(e){}
  ciz();
}
function ceviriDugmesi(y){
  if(cevrilmeli(y)) return `<button class="act" data-cev="${y.id}">${I.dil}<span>${t("cevir")}</span></button>`;
  if(trOf(y)) return `<button class="act" data-orj="${y.id}">${I.dil}<span>${t("orijinal")}</span></button>`;
  return "";
}
function acilanCiz(y){
  const c = trOf(y);
  const kimlikSatiri = kimlikYaz(S.bilgi[y.kaynak] || y.kb);
  const k = kayitliMi(y.id);
  let alan = ""; try{ alan = new URL(y.link).hostname; }catch(e){}
  const dildeOku = "";   // kaynak sayfası telefonun dilinde, tarayıcının kendi çevirisiyle okunur
  const ozet = c ? c.ozet : y.ozet;
  return `<section class="acilan" aria-label="${kac(t("paylasilan_yazi"))}">
    <div class="ust"><span class="etk">${t("paylasilan_yazi")}</span><button class="kapat" data-kapat="1" aria-label="${kac(t("kapat"))}">×</button></div>
    <div class="meta"><span class="src">${kac(kaynakAdi(y.kaynak))}</span>${
      kimlikSatiri ? `<span class="kimlik">${kac(kimlikSatiri)}</span>` : ""}<span class="when">${nezaman(y.tarih)}</span></div>
    ${y.gorsel ? `<img class="buyuk" src="${kac(y.gorsel)}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">` : ""}
    <h2>${kac(c ? c.baslik : y.baslik)}</h2>
    ${c ? `<p class="orig">${kac(y.baslik)}</p>` : ""}
    ${y.yazar ? `<p class="yz">${kac(y.yazar)}</p>` : ""}
    ${ozet ? `<p class="sum">${kac(ozet)}</p>` : ""}
    <div class="dugmeler">
      <a class="dugme ana" href="${kac(y.link)}" target="_blank" rel="noopener" data-oku="${y.id}">${I.dis}<span>${t("kaynakta_oku")}</span></a>
      ${dildeOku ? `<a class="dugme" href="${kac(dildeOku)}" target="_blank" rel="noopener" data-oku="${y.id}">${I.dil}<span>${kac(t("dilde_oku", dilAdi(S.ceviriDili)))}</span></a>` : ""}
    </div>
    <div class="acts">
      <button class="act ${k?"on":""}" data-kay="${y.id}">${k?I.yerD:I.yer}<span>${t(k?"kayitli":"kaydet")}</span></button>
      ${ceviriDugmesi(y)}
      <button class="act" data-pay="${y.id}">${I.pay}<span>${t("paylas")}</span></button>
    </div>
  </section>`;
}

/* ---------- Tema ---------- */
const TEMA_RENK = {koyu:"#0B1420", acik:"#F4F0E6"};
function temaUygula(tm){
  document.documentElement.setAttribute("data-tema", tm);
  const m = document.querySelector('meta[name="theme-color"]'); if(m) m.content = TEMA_RENK[tm] || TEMA_RENK.koyu;
  const d = $("#tema");
  if(d){ d.innerHTML = tm==="acik" ? I.ay : I.gunes; d.setAttribute("aria-label", t(tm==="acik" ? "koyu_temaya" : "acik_temaya")); }
}
(function seritKur(){
  const hedef = document.querySelector(".masthead .manzara");
  const serit = document.getElementById("ustSerit");
  if(!hedef || !serit || !("IntersectionObserver" in window)) return;
  new IntersectionObserver(([e]) => {
    document.body.classList.toggle("serit-acik", !e.isIntersecting && e.boundingClientRect.top < 0);
  }, { rootMargin: "-56px 0px 0px 0px", threshold: 0 }).observe(hedef);
  serit.addEventListener("click", () => scrollTo({ top: 0, behavior: "smooth" }));
})();
function temaDegistir(){
  const tm = document.documentElement.getAttribute("data-tema")==="acik" ? "koyu" : "acik";
  try{ localStorage.setItem("ti.tema", tm); }catch(e){}
  temaUygula(tm);
}

/* ---------- Arayüz dili ---------- */
function arayuzuCiz(){
  document.documentElement.lang = S.dil;
  const dd = $("#dilAc"); if(dd){ $("#dilKod").textContent = S.dil.split("-")[0].toUpperCase(); dd.setAttribute("aria-label", t("dil_sec")); dd.title = t("dil_sec"); }

/* ---------- Tefekkur ---------- */
async function tefekkuruCek(){
  if(S.tefekkur || S.tefekkurYukleniyor) return;
  S.tefekkurYukleniyor = true;
  try{
    const c = await fetch("tefekkur.json?t="+Date.now(), {cache:"no-store"});
    S.tefekkur = c.ok ? await c.json() : [];
  }catch(e){ S.tefekkur = []; }
  if(!Array.isArray(S.tefekkur)) S.tefekkur = [];
  S.tefekkurYukleniyor = false;
  if(S.ekran==="tefekkur") cizTefekkur();
}
S.tefAcik = null; S.tefMetin = {}; S.tefCeviri = {}; S.tefCeviriAcik = false;
/* Tefekkür yazıları da akıştaki kartlar gibi kaydedilir, çevrilir, paylaşılır.
   "Kaynak" düğmesi yok: kaynak biziz. Yazılar Türkçe olduğu için Türkçe okura çevir düğmesi gösterilmez. */
function tefOge(x){
  const slug = String(x.yol||"").replace(/\.html$/, "");
  return {id:"tef:"+slug, kaynak:"Tefekkür", baslik:x.baslik||"", ozet:x.ozet||"", yazar:x.yazar||"",
          gorsel:"", link:x.yol||"", tarih:x.tarih||"", tef:x.yol||""};
}
const tefOgeleri = () => (S.tefekkur||[]).map(tefOge);
const tefCevrilebilir = () => S.ceviriDili !== "tr";
function tefDugmeleri(y){
  const k = kayitliMi(y.id);
  return `<button class="act ${k?"on":""}" data-kay="${y.id}">${k?I.yerD:I.yer}<span>${t(k?"kayitli":"kaydet")}</span></button>`
    + (tefCevrilebilir() ? ceviriDugmesi(y) : "")
    + `<button class="act" data-pay="${y.id}">${I.pay}<span>${t("paylas")}</span></button>`;
}
function tefKart(y, listede){
  const c = trOf(y);
  const ust = listede
    ? `<span class="src">${kac(y.yazar)}</span><span class="when">${kac(tarihYaz(y.tarih))}</span>`
    : `<span class="src">${kac(t("nav_tefekkur"))}</span><span class="yazar">${kac(y.yazar)}</span><span class="when">${kac(tarihYaz(y.tarih))}</span>`;
  return `<article class="entry tef-entry"><div class="meta">${ust}</div>
    <div class="govde"><div class="yazi" data-tefac="${kac(y.tef)}" role="link" tabindex="0">
      <h2>${kac(c ? c.baslik : y.baslik)}</h2>${c ? `<p class="orig">${kac(y.baslik)}</p>` : ""}
      ${(c ? c.ozet : y.ozet) ? `<p class="sum">${kac(c ? c.ozet : y.ozet)}</p>` : ""}
    </div></div>
    <div class="acts">${tefDugmeleri(y)}</div></article>`;
}
function tefOkuDugmeleri(y){
  const k = kayitliMi(y.id);
  const cev = !tefCevrilebilir() ? ""
    : `<button class="act" data-tefcevir="${kac(y.tef)}">${I.dil}<span>${t(S.tefCeviriAcik ? "orijinal" : "cevir")}</span></button>`;
  return `<button class="act ${k?"on":""}" data-kay="${y.id}">${k?I.yerD:I.yer}<span>${t(k?"kayitli":"kaydet")}</span></button>`
    + cev + `<button class="act" data-pay="${y.id}">${I.pay}<span>${t("paylas")}</span></button>`;
}
/* Yazının tamamını okurun diline çevir: başlık, paragraflar, mısralar satır satır; imzadaki ad olduğu gibi kalır */
async function tefYaziyiCevir(yol){
  if(S.tefCeviriAcik){ S.tefCeviriAcik = false; cizTefekkur(); return; }
  const anahtar = yol + "|" + S.ceviriDili;
  if(!S.tefCeviri[anahtar]){
    document.querySelectorAll("[data-tefcevir] span").forEach(s => s.textContent = t("cevriliyor"));
    try{
      const kap = document.createElement("div"); kap.innerHTML = S.tefMetin[yol] || "";
      const isler = [];
      kap.querySelectorAll("h1, p").forEach(el => {
        if(el.classList.contains("yazar-satir") || el.classList.contains("tarih")) return;
        if(el.classList.contains("imza")){ el.querySelectorAll("em").forEach(em => isler.push([em, em.textContent])); return; }
        if(el.classList.contains("misra")){
          const satirlar = el.innerHTML.split(/<br\s*\/?>/i).map(s => { const d = document.createElement("div"); d.innerHTML = s; return d.textContent; });
          const kutu = {el, satirlar, sonuc: []};
          satirlar.forEach((s, i) => isler.push([kutu, s, i]));
          return;
        }
        isler.push([el, el.textContent]);
      });
      for(let i = 0; i < isler.length; i += 3){
        const grup = isler.slice(i, i+3);
        const sonuc = await Promise.all(grup.map(([, m]) => cevir(m)));
        grup.forEach(([hedef, , sira], j) => {
          if(hedef.satirlar){ hedef.sonuc[sira] = sonuc[j].metin; }
          else hedef.textContent = sonuc[j].metin;
        });
      }
      isler.forEach(([hedef]) => { if(hedef.satirlar && !hedef.yazildi){ hedef.yazildi = true;
        hedef.el.innerHTML = hedef.sonuc.map(s => kac(s || "")).join("<br>"); } });
      S.tefCeviri[anahtar] = kap.innerHTML;
    }catch(e){
      document.querySelectorAll("[data-tefcevir] span").forEach(s => s.textContent = t("ceviri_kapali"));
      return;
    }
  }
  S.tefCeviriAcik = true; cizTefekkur();
}
async function tefAc(yol, gecmiseYaz = true){
  S.tefAcik = yol; S.ekran = "tefekkur"; S.tefCeviriAcik = false;
  if(gecmiseYaz) try{ history.pushState({tef:yol}, "", "#" + yol.replace(/\.html$/, "")); }catch(e){}
  ciz(); scrollTo({top:0});
  if(S.tefMetin[yol] !== undefined) return;
  try{
    const c = await fetch(yol, {cache:"no-cache"});
    if(!c.ok) throw 0;
    const sayfa = new DOMParser().parseFromString(await c.text(), "text/html");
    const yazi = sayfa.querySelector("article");
    S.tefMetin[yol] = yazi ? yazi.innerHTML : null;
  }catch(e){ S.tefMetin[yol] = null; }
  if(S.tefAcik === yol && S.ekran === "tefekkur") cizTefekkur();
}
function tefKapat(){
  if(history.state && history.state.tef) history.back();
  else { S.tefAcik = null; cizTefekkur(); }
}
addEventListener("popstate", e => {
  const yol = e.state && e.state.tef;
  if(yol) tefAc(yol, false);
  else if(S.tefAcik){ S.tefAcik = null; if(S.ekran === "tefekkur") cizTefekkur(); }
});

const tarihYaz = x => { const d=tarihOku(x); return d ? d.toLocaleDateString(S.arayuz,{day:"numeric",month:"long",year:"numeric"}) : ""; };
const altBaglantilar = () => `<div class="alt-baglantilar"><a href="hakkinda.html">${t("hakkinda")}</a>·<a href="iletisim.html">${t("iletisim")}</a>·<a href="gizlilik.html">${t("gizlilik")}</a></div>`;
function cizTefekkur(){
  if(S.tefAcik){
    const metin = S.tefMetin[S.tefAcik];
    const cevrilmis = S.tefCeviriAcik ? S.tefCeviri[S.tefAcik + "|" + S.ceviriDili] : null;
    $("#count").textContent = "";
    $("#tefekkur").innerHTML = `<div class="tef-oku"><button class="tef-geri" type="button" data-tefgeri="1">← ${t("nav_tefekkur")}</button><div class="tef-metin">${
      metin === undefined ? `<div class="state"><p>${t("yukleniyor")}</p></div>`
      : metin === null ? `<div class="state"><p>${t("hic_acilmadi")}</p></div>` : (cevrilmis || metin)}</div></div>` + altBaglantilar();
    if(metin){
      const y = tefOgeleri().find(o => o.tef === S.tefAcik) || tefOge({yol:S.tefAcik});
      const cubuk = () => { const d = document.createElement("div"); d.className = "acts tef-acts"; d.innerHTML = tefOkuDugmeleri(y); return d; };
      const ys = $("#tefekkur .tef-metin .yazar-satir"); if(ys) ys.after(cubuk());
      $("#tefekkur .tef-metin").append(cubuk());
    }
    return;
  }
  const liste = S.tefekkur || [];
  $("#count").textContent = liste.length ? t("yazi_sayisi", sayi(liste.length)) : "";
  const giris = `<div class="tef-giris"><h3>${t("tef_baslik")}</h3><p>${t("tef_giris")}</p></div>`;
  const govde = S.tefekkur===null
    ? `<div class="state"><p>${t("yukleniyor")}</p></div>`
    : liste.length
      ? liste.map(x => tefKart(tefOge(x), true)).join("")
      : `<div class="state"><img class="mark" src="logo-seffaf.png" alt="" aria-hidden="true">
          <h3>${t("tef_yakinda")}</h3><p>${t("tef_yakinda_aciklama")}</p></div>`;
  $("#tefekkur").innerHTML = giris + govde + altBaglantilar();
}

/* "Kaynak": yazı okurun seçtiği dilde değilse kaynağın kendisi o dile çevrilmiş olarak açılır
   (telefonun dili ne olursa olsun, Türkan'da hangi dil seçiliyse o). Google'ın çeviri sayfasının üstünde
   "orijinal" düğmesi de var. Google Haberler bağlantıları henüz çevrilemiyor, onlar olduğu gibi açılır. */
/* Uygulama olarak kuruluysa (Play'den) yazılar uygulamanın içindeki tarayıcı penceresinde açılır;
   tarayıcıda açılmışsa aynı sekmede açılır, yeni sekme birikmez */
const kuruluMu = () => matchMedia("(display-mode: standalone)").matches || matchMedia("(display-mode: minimal-ui)").matches
  || navigator.standalone === true || document.referrer.startsWith("android-app://");

function ceviriAdresi(adres, hedef){
  try{
    const u = new URL(adres);
    if(u.protocol !== "https:" || /^[\d.]+$/.test(u.hostname) || u.port) throw 0;
    const alan = u.hostname.toLowerCase().replace(/-/g, "--").replace(/\./g, "-") + ".translate.goog";
    const q = new URLSearchParams(u.search);
    q.set("_x_tr_sl", "auto"); q.set("_x_tr_tl", hedef); q.set("_x_tr_hl", hedef); q.set("_x_tr_pto", "wapp");
    return "https://" + alan + u.pathname + "?" + q.toString() + u.hash;
  }catch(e){
    return "https://translate.google.com/translate?sl=auto&tl=" + encodeURIComponent(hedef) + "&u=" + encodeURIComponent(adres);
  }
}

function okumaAdresi(y){
  return y.link;   // kaynak sayfası olduğu gibi açılır; çeviriyi Chrome telefonun diline göre önerir ya da yapar
}
function okumaAdresiEski(y){
  let alan = ""; try{ alan = new URL(y.link).hostname; }catch(e){ return y.link; }
  if(/(^|\.)news\.google\.com$/i.test(alan)) return y.link;
  const hedef = S.dil, kok = d => String(d||"").toLowerCase().split("-")[0];
  const c = S.ceviri[y.id];
  const yaziDili = (c && c.kd) || kok((S.bilgi[y.kaynak]||{}).dil);
  if((c && c.ayni && c.dil===hedef) || (yaziDili && yaziDili===kok(hedef))) return y.link;
  return ceviriAdresi(y.link, hedef);
}

function kart(y){
  const c = trOf(y);
  const k = kayitliMi(y.id);
  const ad = kaynakAdi(y.kaynak);
  return `<article class="entry${S.okunan.includes(y.id)?" okundu":""}">
    <div class="meta"><span class="src">${kac(ad)}</span>${
      y.yazar ? `<span class="yazar">${kac(y.yazar)}</span>` : ""
    }<span class="when">${nezaman(y.tarih)}</span></div>
    <div class="govde">
      <div class="yazi">
        <h2>${kac(c ? c.baslik : y.baslik)}</h2>
        ${c ? `<p class="orig">${kac(y.baslik)}</p>` : ""}
        ${(c?c.ozet:y.ozet) ? `<p class="sum">${kac(c?c.ozet:y.ozet)}</p>` : ""}
      </div>
      ${y.gorsel
        ? `<img class="kapak" src="${kac(y.gorsel)}" alt="" loading="lazy" referrerpolicy="no-referrer"
             data-h="${kac(ad.trim()[0]||"İ")}"
             onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'kapak yer',textContent:this.dataset.h}))">`
        : `<div class="kapak yer">${kac(ad.trim()[0]||"İ")}</div>`}
    </div>
    <div class="acts">
      <button class="act ${k?"on":""}" data-kay="${y.id}">${k?I.yerD:I.yer}<span>${t(k?"kayitli":"kaydet")}</span></button>
      ${ceviriDugmesi(y)}
      <a class="act" href="${kac(okumaAdresi(y))}" target="_blank" rel="noopener" data-oku="${y.id}">${I.dis}<span>${t("kaynak")}</span></a>
      <button class="act" data-pay="${y.id}">${I.pay}<span>${t("paylas")}</span></button>
    </div></article>`;
}

function ciz(){
  $("#acilanAlan").innerHTML = (S.ekran==="feed" && S.acilan) ? acilanCiz(S.acilan) : "";
  $("#katlar").classList.toggle("hide", S.ekran!=="feed");
  $("#rail").classList.toggle("hide", S.ekran!=="feed");
  $("#arama").classList.toggle("hide", S.ekran!=="feed" || !S.aramaAcik);
  $("#etiketler").classList.add("hide");
  if(S.ekran==="feed"){ cizKategoriler(); cizSerit(); }
  $("#feed").classList.toggle("hide", S.ekran!=="feed");
  $("#tefekkur").classList.toggle("hide", S.ekran!=="tefekkur");
  $("#saved").classList.toggle("hide", S.ekran!=="saved");
  $("#sources").classList.toggle("hide", S.ekran!=="sources");
  ["feed","tefekkur","saved","sources"].forEach(e=>$("#nav-"+e).setAttribute("aria-current", S.ekran===e?"page":"false"));
  if(S.ekran==="feed") cizAkis();
  if(S.ekran==="tefekkur"){ cizTefekkur(); tefekkuruCek(); }

}

function cizKategoriler(){
  const sayKat = kod => kod==="hepsi"
    ? S.yazilar.length

  $("#katlar").innerHTML = KATEGORILER.map(kod=>

function cizSerit(){
  const acik = S.kaynaklar
    .filter(k=>k.acik && (S.kategori==="hepsi" || (k.tur||"kurum")===S.kategori))
    .slice().sort((a,b)=>(S.gozde.has(b.ad)-S.gozde.has(a.ad)) || kaynakAdi(a.ad).localeCompare(kaynakAdi(b.ad), S.arayuz));
  const say = a => S.yazilar.filter(y=>y.kaynak===a).length;
  $("#rail").innerHTML =
    `<button class="chip" data-suz="hepsi" aria-pressed="${S.suzgec==="hepsi"}">${t("tumu")}<span class="say">${sayi(S.yazilar.length)}</span></button>` +
    acik.map(k=>{
      const n = say(k.ad);
      return `<button class="chip ${n?"":"bos"}" data-suz="${kac(k.ad)}" aria-pressed="${S.suzgec===k.ad}">${S.gozde.has(k.ad)?'<span class="yz-isaret">★</span>':""}${kac(kaynakAdi(k.ad))}<span class="say">${sayi(n)}</span></button>`;
    }).join("");
}

function cizAkis(){
  if(S.yukleniyor) return;
  let liste = S.yazilar;
  if(S.kategori!=="hepsi") liste = liste.filter(y=>turBul(y.kaynak)===S.kategori);
  if(S.suzgec!=="hepsi")   liste = liste.filter(y=>y.kaynak===S.suzgec);
  if(S.gozdeFiltre)        liste = liste.filter(y=>S.gozde.has(y.kaynak));

  if(S.etiket){
    const e = ETIKETLER.find(x=>x.kod===S.etiket);
    if(e) liste = liste.filter(y=>{
      const c = trOf(y)||{};
      const m = " "+sade(y.baslik+" "+y.ozet+" "+(c.baslik||"")+" "+(c.ozet||""))+" ";
      return e.k.some(w=>m.includes(sade(w)));
    });
  }
  if(S.ara.trim()){
    const kelimeler = sade(S.ara).split(/\s+/).filter(Boolean);
    liste = liste.filter(y=>{
      const c = trOf(y)||{};
      const m = sade(y.baslik+" "+y.ozet+" "+y.kaynak+" "+kaynakAdi(y.kaynak)+" "+(c.baslik||"")+" "+(c.ozet||""));
      return kelimeler.every(w=>m.includes(w));
    });
  }
  $("#count").textContent = S.yazilar.length
    ? t("kaynak_yazi", sayi(S.kaynaklar.filter(k=>k.acik).length), sayi(S.yazilar.length))
    : "";

  if(!liste.length){
    if(S.gozdeFiltre){
      $("#feed").innerHTML = `<div class="state">
        <svg class="mark" aria-hidden="true"><use href="#anka"/></svg>
        <h3>${t(S.gozde.size ? "gozde_bos" : "gozde_yok")}</h3>
        <p>${t("gozde_nasil")}</p>
        <button class="go" data-gozde-filtre="1">${t("tum_akisa_don")}</button></div>`;
      return;
    }
    if(S.ara.trim() || S.etiket){
      const e = ETIKETLER.find(x=>x.kod===S.etiket);
      $("#feed").innerHTML = `<div class="state">
        <img class="mark" src="logo-seffaf.png" alt="" aria-hidden="true">
        <h3>${t("sonuc_yok")}</h3>
        <p>${e ? kac(t("etiket_eslesmedi", etiketAdi(e))) : kac(t("arama_eslesmedi", S.ara))}</p>
        <button class="go" data-sifirla="1">${t("aramayi_temizle")}</button></div>`;
      return;
    }
    // Akış dolu ama seçili bölüm boşsa: bağlantı hatası değil, bölüm henüz boş
    if(S.kategori!=="hepsi" && S.suzgec==="hepsi" && S.yazilar.length){
      $("#feed").innerHTML = `<div class="state">
        <img class="mark" src="logo-seffaf.png" alt="" aria-hidden="true">
        <h3>${t("kategori_bos")}</h3><p>${t("kategori_bos_aciklama")}</p>
        <button class="go" data-kat="hepsi">${t("tum_akisa_don")}</button></div>`;
      return;
    }
    const tekKaynak = S.suzgec!=="hepsi";
    $("#feed").innerHTML = `<div class="state">
      <img class="mark" src="logo-seffaf.png" alt="" aria-hidden="true">
      <h3>${tekKaynak ? kac(t("kaynak_acilmadi", kaynakAdi(S.suzgec))) : (YEREL ? t("yerel_acildi") : t("hic_acilmadi"))}</h3>
      <p>${tekKaynak ? t("kaynak_acilmadi_aciklama") : (YEREL ? t("yerel_aciklama") : t("hic_aciklama"))}</p>
      <button class="go" data-yeni="1">${t("yeniden_dene")}</button>
      <button class="go" data-git="sources">${t("nav_kaynaklar")}</button>
      ${S.hata.length ? `<p class="warn" style="text-align:start;margin-top:26px;font-size:12px;line-height:1.6">${
        S.hata.map(h=>"<strong>"+kac(kaynakAdi(h.ad))+"</strong> — "+kac(h.mesaj)).join("<br>")}</p>` : ""}
      </div>`;
    return;
  }
  const parca = liste.slice(0, S.goster);
  const cevrilmemis = parca.filter(cevrilmeli).length;
  const cubuk = `<div class="cubuk">
      <button class="mini" data-yeni="1"${S.yukleniyor?" disabled":""}>${t(S.yukleniyor?"yenileniyor":"yenile")}</button>
      ${cevrilmemis ? `<button class="mini" data-toplu="1"${S.topluCeviri?" disabled":""}>${
          S.topluCeviri ? t("cevriliyor_n", S.topluKalan||0) : t("hepsini_cevir", sayi(cevrilmemis))}</button>` : ""}
      <button class="mini${S.gozdeFiltre?" secili":""}" data-gozde-filtre="1" aria-pressed="${S.gozdeFiltre}">★ ${t("gozdeler")}${S.gozde.size ? " ("+sayi(S.gozde.size)+")" : ""}</button>
      ${S.suzgec!=="hepsi" ? `<button class="mini${S.gozde.has(S.suzgec)?" secili":""}" data-gozde-ekle="${kac(S.suzgec)}">${S.gozde.has(S.suzgec) ? "★ "+t("gozdede") : "☆ "+t("gozdeye_ekle")}</button>` : ""}
      ${S.dolu ? `<span class="uyari">${t("depo_doldu")}</span>` : ""}
    </div>`;
  const kalan = liste.length - parca.length;
  const dahaFazla = kalan
    ? `<div class="daha"><button class="mini" data-daha="1">${t("daha_eski", sayi(kalan))}</button></div>`
    : (liste.length>40 ? `<div class="daha"><span class="son">${t("arsiv_sonu", sayi(liste.length))}</span></div>` : "");
  $("#feed").innerHTML = cubuk + parca.map(kart).join("") + dahaFazla + altBaglantilar();
  if(S.otoCeviri && !S.topluCeviri && cevrilmemis) setTimeout(hepsiniCevir, 0);
}

function cizKaynaklar(){
  $("#count").textContent="";
  const hataVar = ad => S.hata.some(h=>h.ad===ad);
  const say = ad => S.yazilar.filter(y=>y.kaynak===ad).length;
  const arsiv = ad => ((S.bellek[ad]||{}).yazilar||[]).length;
  const secenek = (liste, secili) => liste.map(([k,a])=>`<option value="${k}"${k===secili?" selected":""}>${kac(a)}</option>`).join("");

  $("#sources").innerHTML = `
    <div class="ayar">
      <div class="ayar-bas">${t("dil_baslik")}</div>
      <label class="ayar-satir"><span>${t("dil_etiket")}</span><select id="secDil">${DIL_GRUPLARI.map(([g,d])=>`<optgroup label="${kac(t("grup_"+g))}">${secenek(d, S.dil)}</optgroup>`).join("")}</select></label>
      <p class="ayar-not">${t("dil_aciklama")}</p>
    </div>
    <p class="note" style="padding-top:14px">${S.guncellendi
      ? t("son_tarama", new Date(S.guncellendi).toLocaleString(S.arayuz,{day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"}))
      : t("henuz_taranmadi")}</p>
    ${KATEGORILER.filter(x=>x!=="hepsi").map(kod=>{
      const grup = S.kaynaklar.map((k,i)=>({k,i})).filter(x=>(x.k.tur||"kurum")===kod)
                    .sort((a,b)=>kaynakAdi(a.k.ad).localeCompare(kaynakAdi(b.k.ad), S.arayuz));
      if(!grup.length) return "";
      return `<h3 class="grupbas">${kac(t("kat_"+kod))}</h3>` + grup.map(({k,i})=>{
      const n=say(k.ad), bozuk=k.acik&&hataVar(k.ad);
      const kim = kimlikYaz(S.bilgi[k.ad]);
      return `<div class="srow">
        <div class="sinfo">
          <div class="nm">${kac(kaynakAdi(k.ad))}</div>
          <div class="durum${bozuk?" kirik":""}">${
            !k.acik ? t("kapali") : bozuk ? (arsiv(k.ad)? t("ulasilamadi_duruyor", sayi(arsiv(k.ad))) : t("ulasilamadi")) : (n?t("yazi_sayisi", sayi(n)):"—")
          }${kim?`<span class="alan">${kac(kim)}</span>`:""}</div>
        </div>
        <button class="yildiz-dugme" data-gozde-ekle="${kac(k.ad)}" aria-pressed="${S.gozde.has(k.ad)}" aria-label="${kac(t("gozdeye_ekle"))}">${S.gozde.has(k.ad)?"★":"☆"}</button>
        <button class="tog" data-ac="${i}" aria-pressed="${!!k.acik}" aria-label="${kac(kaynakAdi(k.ad))}"></button>
        ${k.sunucu ? "" : `<button class="del" data-sil="${i}" aria-label="${kac(k.ad)}">×</button>`}
      </div>`;
      }).join("");
    }).join("")}${altBaglantilar()}`;
}

document.addEventListener("click", e=>{
  const ta = e.target.closest("[data-tefac]");
  if(ta){ tefAc(ta.dataset.tefac); return; }
  const tc = e.target.closest("[data-tefcevir]");
  if(tc){ tefYaziyiCevir(tc.dataset.tefcevir); return; }
  if(e.target.closest("[data-tefgeri]")){ tefKapat(); return; }
  const h = e.target.closest("#aramaAc,[data-gozde-filtre],[data-gozde-ekle],[data-kay],[data-cev],[data-orj],[data-suz],[data-git],[data-ac],[data-sil],[data-yeni],[data-oku],[data-toplu],[data-daha],[data-etiket],[data-sifirla],[data-pay],[data-kat],[data-kapat],#tema");
  if(!h) return;
  if(h.dataset.oku){
    okunduIsaretle(h.dataset.oku); const en=h.closest(".entry"); if(en) en.classList.add("okundu");
    // tarayıcıda yeni sekme açma: aynı sekmede aç, geri gelince okur kaldığı yeri bulsun
    if(h.tagName==="A" && !kuruluMu()){
      e.preventDefault();
      try{ sessionStorage.setItem("ti.donus", JSON.stringify({ekran:S.ekran, kategori:S.kategori, suzgec:S.suzgec, goster:S.goster, y:Math.round(scrollY)})); }catch(_){}
      location.assign(h.href);
    }
    return;
  }
  if(h.dataset.kapat) return yaziyiKapat();
  if(h.id==="tema") return temaDegistir();
  if(h.dataset.gozdeFiltre){
    S.gozdeFiltre = !S.gozdeFiltre; S.goster = 40; S.ekran = "feed"; ciz(); scrollTo({top:0}); return;
  }
  if(h.dataset.gozdeEkle){
    const ad = h.dataset.gozdeEkle;
    if(S.gozde.has(ad)) S.gozde.delete(ad); else S.gozde.add(ad);
    yaz("ti.gozde", [...S.gozde]); ciz(); return;
  }
  if(h.id==="aramaAc"){
    S.aramaAcik = !S.aramaAcik;
    if(!S.aramaAcik && S.ara){ S.ara=""; $("#q").value=""; $("#qsil").classList.add("hide"); S.goster=40; }
    S.ekran = "feed"; ciz();
    if(S.aramaAcik) setTimeout(()=>$("#q").focus(), 30);
    return;
  }
  if(h.dataset.pay) return paylas(h.dataset.pay, h);
  if(h.dataset.kay) return kaydet(h.dataset.kay);
  if(h.dataset.cev) return yaziyiCevir(h.dataset.cev);
  if(h.dataset.orj) return orijinaliGoster(h.dataset.orj);
  if(h.dataset.yeni) return cek();
  if(h.dataset.toplu) return hepsiniCevir();
  if(h.dataset.daha){ S.goster+=40; cizAkis(); return; }
  if(h.dataset.etiket){
    S.etiket = S.etiket===h.dataset.etiket ? "" : h.dataset.etiket;
    S.ara=""; $("#q").value=""; $("#qsil").classList.add("hide");
    S.goster=40; ciz(); scrollTo({top:0}); return;
  }
  if(h.dataset.sifirla){
    S.ara=""; S.etiket=""; $("#q").value=""; $("#qsil").classList.add("hide");
    S.goster=40; ciz(); return;
  }
  if(h.dataset.kat){
    S.kategori=h.dataset.kat; S.suzgec="hepsi"; S.goster=40;
    ciz(); scrollTo({top:0}); return;
  }
  if(h.dataset.suz){ S.suzgec=h.dataset.suz; S.goster=40; ciz(); scrollTo({top:0}); return; }
  if(h.dataset.git){ S.ekran=h.dataset.git; ciz(); return; }
  if(h.dataset.ac !== undefined){
    const k=S.kaynaklar[+h.dataset.ac]; k.acik=!k.acik;
    yaz("ti.kaynaklar6",S.kaynaklar); bellektenTopla(); ciz(); return;
  }
  if(h.dataset.sil !== undefined){
    const k=S.kaynaklar[+h.dataset.sil];
    if(!confirm(t("kaynak_silinsin", kaynakAdi(k.ad)))) return;
    delete S.bellek[k.ad];
    S.kaynaklar.splice(+h.dataset.sil,1); yaz("ti.kaynaklar6",S.kaynaklar); ciz(); cek(); return;
  }
});

function dilIpucuGoster(){
  try{ if(localStorage.getItem("ti.dilIpucu")) return; }catch(e){ return; }
  const c = cihazDili(), kok = c.startsWith("zh") ? "zh-CN" : c.startsWith("fil") ? "tl" : c.split("-")[0];
  if(kok === "tr" || S.dil !== "tr") return;             // Türkçe telefonda ya da dil zaten seçilmişse gerek yok
  const d = $("#dilAc"); if(!d) return;
  const r = d.getBoundingClientRect(); if(!r.width) return;
  const b = document.createElement("div"); b.className = "dil-ipucu"; b.setAttribute("role","status");
  const yerel = DIL_IPUCU[kok] || DIL_IPUCU.en;
  b.innerHTML = `🌐 ${kac(yerel)}${yerel !== DIL_IPUCU.en ? `<small>Change language</small>` : ""}`;
  document.body.appendChild(b);
  const w = b.offsetWidth, orta = r.left + r.width/2;
  const sol = Math.max(8, Math.min(innerWidth - w - 8, orta - w + 26));
  b.style.left = sol + "px"; b.style.top = (r.bottom + 11) + "px";
  b.style.setProperty("--ok", Math.max(10, sol + w - orta - 6) + "px");
  requestAnimationFrame(() => b.classList.add("acik"));
  d.classList.add("nabiz");
  let kapandi = false;
  const kapat = () => { if(kapandi) return; kapandi = true; b.remove(); d.classList.remove("nabiz");
    document.removeEventListener("click", disari, true); };
  const disari = e => { if(!b.contains(e.target)) kapat(); };
  b.addEventListener("click", () => { kapat(); dilPenceresiAc(); });
  setTimeout(() => document.addEventListener("click", disari, true), 0);
  setTimeout(kapat, 9000);
  try{ localStorage.setItem("ti.dilIpucu","1"); }catch(e){}
}

/* ---------- "Uygulamayı yükle": yalnız tarayıcıdan girenlere ----------
   PLAY_ADRESI şimdilik boş: Chrome'un kendi kurulum penceresi açılır (dosya inmez, uyarı çıkmaz).
   Google Play onayı gelince buraya mağaza adresi yazılır; Android'de düğme doğrudan Play'e götürür:
   "https://play.google.com/store/apps/details?id=com.turkanidrak.app" */
const PLAY_ADRESI = "";
let kurulumIstegi = null;
addEventListener("beforeinstallprompt", e => { e.preventDefault(); kurulumIstegi = e; });
addEventListener("appinstalled", () => { kurulumIstegi = null; const h = $(".yukle-hap"); if(h) h.remove(); });
const iosMu = () => /iphone|ipad|ipod/i.test(navigator.userAgent) && !/crios|fxios/i.test(navigator.userAgent);
const androidMu = () => /android/i.test(navigator.userAgent);
function yukleDugmesiGoster(){
  if(kuruluMu() || $(".yukle-hap")) return;
  try{ const k = +localStorage.getItem("ti.yukleKapat") || 0; if(Date.now() - k < 14*86400000) return; }catch(e){}
  const play = PLAY_ADRESI && androidMu();
  if(!play && !kurulumIstegi && !iosMu()) return;          // bu tarayıcıda kurulum yolu yok
  const h = document.createElement("div"); h.className = "yukle-hap"; h.setAttribute("role","region");
  const simge = '<svg aria-hidden="true"><use href="#anka"/></svg>';
  h.innerHTML = (play
      ? `<a class="yk-ana" href="${kac(PLAY_ADRESI)}" target="_blank" rel="noopener">${simge}<span>${kac(t("yukle"))}</span></a>`
      : `<button class="yk-ana" type="button">${simge}<span>${kac(t("yukle"))}</span></button>`)
    + `<button class="yk-kapat" type="button" aria-label="${kac(t("yukle_kapat"))}">×</button>`;
  document.body.appendChild(h);
  requestAnimationFrame(() => h.classList.add("acik"));
  const kapat = (kalici) => { h.remove(); const i = $(".yukle-ios"); if(i) i.remove();
    if(kalici) try{ localStorage.setItem("ti.yukleKapat", String(Date.now())); }catch(e){} };
  h.querySelector(".yk-kapat").addEventListener("click", () => kapat(true));
  if(!play) h.querySelector(".yk-ana").addEventListener("click", async () => {
    if(kurulumIstegi){
      kurulumIstegi.prompt();
      const sonuc = await kurulumIstegi.userChoice.catch(() => null);
      kurulumIstegi = null;
      if(sonuc && sonuc.outcome === "accepted") kapat(false);
    } else if(iosMu()){
      let i = $(".yukle-ios");
      if(i){ i.remove(); return; }
      i = document.createElement("div"); i.className = "yukle-ios"; i.textContent = t("yukle_ios");
      document.body.appendChild(i);
    }
  });
}
setTimeout(yukleDugmesiGoster, 6500);     // açılış sahnesi ve dil işaretinden sonra

function dilPenceresiAc(){
  let p = $("#dilPencere");
  if(!p){ p = document.createElement("div"); p.id = "dilPencere"; p.className = "dil-pencere"; document.body.appendChild(p);
    p.addEventListener("click", e => { if(e.target === p) dilPenceresiKapat(); }); }
  const yerli = k => (CEVIRI_DILLERI.find(([d])=>d===k)||[])[1];
  const yerelAd = k => { const a = S.arayuz==="tr" ? DIL_TR[k] : dilAdi(k); return a && a !== yerli(k) && a.toLowerCase() !== k ? a : ""; };
  p.innerHTML = `<div class="dil-kutu" role="dialog" aria-modal="true" aria-label="${kac(t("dil_sec"))}">
    <div class="dil-bas">${kac(t("dil_sec"))}</div>
    <input class="dil-ara" type="search" placeholder="${kac(t("dil_ara"))}" aria-label="${kac(t("dil_ara"))}" autocomplete="off">
    ${DIL_GRUPLARI.map(([g, diller]) => `<div class="dil-grup" data-grup="${g}"><h4>${kac(t("grup_"+g))}</h4><div class="dil-liste">${
      diller.map(([k,a]) => { const y = yerelAd(k);
        return `<button data-dilsec="${k}" lang="${k}" data-ara="${kac((a+" "+y+" "+(DIL_TR[k]||"")+" "+k).toLocaleLowerCase("tr"))}"${k===S.dil?' class="secili" aria-current="true"':""}>`
          + `<b>${k.split("-")[0].toUpperCase()}</b><span>${kac(a)}${y?`<small>${kac(y)}</small>`:""}</span></button>`; }).join("")
    }</div></div>`).join("")}
    <p class="dil-bos" hidden>${kac(t("dil_bulunamadi"))}</p>
    <p class="dil-not">${kac(t("dil_not"))}</p></div>`;
  p.hidden = false;
  const ara = p.querySelector(".dil-ara");
  ara.addEventListener("input", () => {
    const q = ara.value.trim().toLocaleLowerCase("tr"); let toplam = 0;
    p.querySelectorAll(".dil-grup").forEach(g => {
      let n = 0;
      g.querySelectorAll("[data-dilsec]").forEach(b => { const v = !q || b.dataset.ara.includes(q); b.hidden = !v; if(v) n++; });
      g.hidden = !n; toplam += n;
    });
    p.querySelector(".dil-bos").hidden = toplam > 0;
  });
  const secili = p.querySelector(".secili"); if(secili) secili.scrollIntoView({block:"center"});
  p.querySelectorAll("[data-dilsec]").forEach(b => b.addEventListener("click", () => dilSec(b.dataset.dilsec)));
}
function dilPenceresiKapat(){ const p = $("#dilPencere"); if(p) p.hidden = true; }
async function dilSec(kod){
  if(!CEVIRI_DILLERI.some(([k])=>k===kod)) return;
  dilPenceresiKapat();
  S.dil = S.arayuz = S.ceviriDili = kod; yaz("ti.dil", kod);
  if(!SOZLUK[kod]){ const sakli = yukle("ti.arayuzMT", null);
    S.arayuzMT = (sakli && sakli.kod===kod && sakli.surum===arayuzSurumu()) ? mtKur(sakli.metin) : {}; }
  else S.arayuzMT = {};
  arayuzuCiz(); ciz();
  if(!SOZLUK[kod] && !Object.keys(S.arayuzMT).length){ await arayuzuHazirla(kod); if(S.dil===kod){ arayuzuCiz(); ciz(); } }
}
$("#dilAc").addEventListener("click", dilPenceresiAc);
addEventListener("keydown", e => { if(e.key==="Escape") dilPenceresiKapat(); });

arayuzuCiz();
bellektenTopla();
if(!SOZLUK[S.dil] && !Object.keys(S.arayuzMT).length)
  arayuzuHazirla(S.dil).then(() => { arayuzuCiz(); ciz(); });

/* ---------- Açılış: iki anka denizden çıkar, Ayasofya'nın üstünde buluşur, göğe yükselir (4,8 sn: Fetih suresi, 48) ---------- */
/* ---------- Video açılışı (acilis.mp4, 19 sn; dik ekranda varsa acilis-dikey.mp4) ----------
   Günün ilk açılışında video baştan oynar, "Atla" 4 sn sonra belirir.
   Gün içindeki sonraki açılışlarda "Atla" baştan hazırdır. Video bitince yumuşakça uygulamaya geçer.
   Video yoksa, açılmazsa ya da 3,5 sn içinde başlamazsa (yavaş bağlantı) kısa ankalı sahne oynar. */
const INTRO_VIDEO = "acilis.mp4";
function videoAcilis(ac, bitir, yedek){
  const bugun = new Date().toLocaleDateString("sv");          // yerel gün, YYYY-AA-GG
  let ilkBugun = true; try{ ilkBugun = localStorage.getItem("ti.introGun") !== bugun; }catch(e){}
  const k = document.createElement("div"); k.id = "acilisVideo";
  k.innerHTML = `<video playsinline preload="auto" aria-hidden="true"></video>
    <button class="av-dugme av-atla" type="button">${kac(t("atla"))} →</button>
    <button class="av-dugme av-ses" type="button" aria-label="${kac(t("ses_ac"))}">🔇 ${kac(t("ses_ac"))}</button>`;
  document.body.appendChild(k);
  ac.style.visibility = "hidden";
  const v = k.querySelector("video"), atla = k.querySelector(".av-atla"), ses = k.querySelector(".av-ses");
  let bitti = false, basladi = false;
  const kapat = sure => {
    if(bitti) return; bitti = true;
    try{ v.pause(); }catch(e){}
    k.animate([{opacity:1},{opacity:0}], {duration:sure, easing:"ease-in", fill:"forwards"}).finished.then(() => { k.remove(); bitir(); });
  };
  const yedegeGec = () => {
    if(basladi || bitti) return; bitti = true;
    try{ v.pause(); v.removeAttribute("src"); v.load(); }catch(e){}
    k.remove(); ac.style.visibility = ""; yedek();
  };
  atla.addEventListener("click", () => kapat(320));
  ses.addEventListener("click", () => { v.muted = false; v.volume = 1; ses.classList.remove("gorunur"); });
  v.addEventListener("playing", () => {
    if(basladi) return; basladi = true;
    try{ localStorage.setItem("ti.introGun", bugun); }catch(e){}
    setTimeout(() => atla.classList.add("gorunur"), ilkBugun ? 4000 : 0);
  });
  v.addEventListener("ended", () => kapat(750));
  const adaylar = innerHeight > innerWidth ? ["acilis-dikey.mp4", INTRO_VIDEO] : [INTRO_VIDEO];
  v.addEventListener("error", () => {                       // bu dosya yoksa sıradakini dene
    adaylar.shift();
    if(adaylar.length && !basladi && !bitti){ v.src = adaylar[0]; v.play().catch(() => { v.muted = true; v.play().catch(()=>{}); }); }
    else yedegeGec();
  });
  setTimeout(yedegeGec, 4000);
  v.src = adaylar[0];
  v.muted = false;
  const oynat = v.play();
  if(oynat && oynat.catch) oynat.catch(() => {           // tarayıcı sesli otomatik oynatmaya izin vermediyse: sessiz başla
    v.muted = true;
    v.play().then(() => ses.classList.add("gorunur")).catch(yedegeGec);
  });
}

function acilisOynat(){
  const kok = document.documentElement, ac = document.getElementById("acilis");
  if(!ac) return;
  const bitir = () => { ac.remove(); kok.classList.remove("acilis-var"); setTimeout(dilIpucuGoster, 600); };
  if(!kok.classList.contains("acilis-var") || !ac.animate){ bitir(); return; }
  try{ sessionStorage.setItem("ti.acilis","1"); }catch(e){}
  videoAcilis(ac, bitir, kisaSahne);

  function kisaSahne(){
  let bitti = false;
  ac.addEventListener("click", () => {             // dokununca hemen geç
    if(bitti) return; bitti = true;
    ac.animate([{opacity:1},{opacity:0}], {duration:220, fill:"forwards"}).finished.then(bitir);
  });
  const gece = kok.getAttribute("data-tema") !== "acik";
  const resim = new Image(); resim.src = gece ? "dunya-gece.webp" : "dunya-gunduz.webp";
  const hazir = resim.decode ? resim.decode().catch(()=>{}) : Promise.resolve();
  Promise.race([hazir, new Promise(r=>setTimeout(r,450))]).then(() => { if(!bitti) baslat(); });

  function baslat(){
    const z = t => Math.round(t * 4800 / 3700);   // bütün zamanlar sahne 4,8 sn sürecek biçimde ölçeklenir
    ac.querySelector(".ac-perde").animate([{opacity:1},{opacity:0}], {duration:z(320), easing:"ease-out", fill:"forwards"});
    const W = innerWidth, H = innerHeight;
    const bant = ac.querySelector(".ac-bant").getBoundingClientRect();
    const kusB = document.getElementById("kusBati"), kusD = document.getElementById("kusDogu");
    kusD.querySelector("img").src = kusB.querySelector("img").src;
    const su = bant.top + bant.height * .84;                                       // deniz yüzeyi
    const kubbe = {x: bant.left + bant.width * .505, y: bant.top + bant.height * .06}; // Ayasofya'nın üstü, hilal hizası
    const kw = kusB.getBoundingClientRect().width || Math.min(W * .22, 140);
    const ara = kw * .3;
    if(gece) for(let i=0;i<18;i++){
      const s = document.createElement("i"); s.className = "ac-yildiz";
      s.style.left = (Math.random()*100).toFixed(1)+"%";
      s.style.top = (Math.random()*bant.top*.85).toFixed(0)+"px";
      s.style.animationDelay = (Math.random()*1.4).toFixed(2)+"s";
      ac.insertBefore(s, ac.firstChild);
    }
    const TOPLAM = z(3300);                    // kuşlar ~4,3 sn'de göğe karışır; sahne 4,8'de kapanır
    const tr = (x,y,s,r) => `translate(${x.toFixed(1)}px,${y.toFixed(1)}px) scale(${s.toFixed(3)}) rotate(${r.toFixed(2)}deg)`;
    const yumusak = t => .5 - Math.cos(Math.PI*t)/2;
    const bez = (a,k,b,t) => { const u=1-t; return {x:u*u*a.x+2*u*t*k.x+t*t*b.x, y:u*u*a.y+2*u*t*k.y+t*t*b.y}; };
    function toz(x, y, zaman){
      const d = document.createElement("i"); d.className = "ac-toz"; ac.appendChild(d);
      d.animate([{transform:`translate(${x}px,${y}px) scale(.7)`, opacity:0},
                 {transform:`translate(${x}px,${y+4}px) scale(1)`, opacity:.9, offset:.2},
                 {transform:`translate(${x}px,${y+16}px) scale(.3)`, opacity:0}],
                {duration:z(950), delay:zaman, easing:"ease-out", fill:"forwards"});
    }
    function ucus(el, basX, yon){
      const cik    = {x: basX, y: su - bant.height * .32};
      const hedef  = {x: kubbe.x + yon * ara, y: kubbe.y};
      const kontrol= {x: basX + (hedef.x - basX) * .38, y: Math.min(bant.top - bant.height * .6, cik.y - bant.height * 1.1)};
      const asil   = {x: hedef.x, y: hedef.y - 8};
      const doruk  = {x: kubbe.x + yon * W * .38, y: H * .08};
      const vKont  = {x: hedef.x + yon * W * .04, y: hedef.y - H * .32};
      const kare = [
        {offset:0,          transform:tr(basX, su, .22, 0), opacity:0},
        {offset:z(150)/TOPLAM, transform:tr(basX, su, .22, 0), opacity:0, easing:"ease-out"},
        {offset:z(700)/TOPLAM, transform:tr(cik.x, cik.y, .42, 0), opacity:1}
      ];
      const n = 18;                                  // geniş kavis: Ayasofya'nın üstüne süzülüş
      for(let i=1;i<=n;i++){
        const p = bez(cik, kontrol, hedef, yumusak(i/n));
        const r = -yon * 7 * Math.sin(Math.PI * i/n);
        const zaman = z(700 + 1350*i/n);
        kare.push({offset:zaman/TOPLAM, transform:tr(p.x, p.y, .42 + .24*i/n, r), opacity:1});
        if(i % 3 === 0) toz(p.x, p.y + kw*.25, zaman);
      }
      kare.push({offset:z(2300)/TOPLAM, transform:tr(asil.x, asil.y, .68, 0), opacity:1});
      const m = 10;                                  // buluşmadan sonra iki yana açılarak göğe
      for(let i=1;i<=m;i++){
        const p = bez(asil, vKont, doruk, yumusak(i/m));
        const r = yon * 6 * Math.sin(Math.PI * i/m);
        const zaman = z(2300 + 700*i/m);
        kare.push({offset:zaman/TOPLAM, transform:tr(p.x, p.y, .68 + .2*i/m, r), opacity:1});
        if(i % 2 === 0) toz(p.x, p.y + kw*.3, zaman);
      }
      kare.push({offset:1, transform:tr(kubbe.x + yon * W * .44, H * .02, .9, 0), opacity:0});
      el.animate(kare, {duration:TOPLAM, fill:"forwards"});
      const h = document.createElement("div"); h.className = "ac-halka"; ac.appendChild(h);
      h.animate([{transform:`translate(${basX}px,${su}px) scale(.3)`, opacity:.8},
                 {transform:`translate(${basX}px,${su}px) scale(4.2)`, opacity:0}],
                {duration:z(1100), delay:z(150), easing:"ease-out", fill:"forwards"});
    }
    ucus(kusB, bant.left + bant.width * .045, -1);   // en batı: Özgürlük Heykeli'nin önündeki deniz
    ucus(kusD, bant.left + bant.width * .955,  1);   // en doğu: Gök Tapınağı'nın önündeki deniz
    ac.querySelector(".ac-isik").animate([
      {transform:`translate(${kubbe.x}px,${kubbe.y}px) scale(.3)`, opacity:0},
      {transform:`translate(${kubbe.x}px,${kubbe.y}px) scale(1.15)`, opacity:.95, offset:.35},
      {transform:`translate(${kubbe.x}px,${kubbe.y}px) scale(2.1)`, opacity:0}],
      {duration:z(900), delay:z(1950), easing:"ease-out", fill:"forwards"});
    ac.querySelector(".ac-marka").animate([{opacity:0, transform:"translateY(12px)"},{opacity:1, transform:"none"}],
      {duration:z(450), delay:z(2720), easing:"ease-out", fill:"forwards"});
    ac.animate([{opacity:1},{opacity:0}], {duration:z(450), delay:z(3250), easing:"ease-in", fill:"forwards"})
      .finished.then(() => { if(!bitti){ bitti = true; bitir(); } });
  }
  }
}
acilisOynat();

/* Başlık satırı dar ekranlarda taşmasın: sığmazsa yalnız yazı adı yarımşar piksel küçülür */
function basligiSigdir(){
  const bas=document.querySelector(".masthead .bas"), wm=bas && bas.querySelector(".wordmark");
  if(!wm) return;
  wm.style.fontSize="";
  let fs=parseFloat(getComputedStyle(wm).fontSize), n=0;
  while(bas.scrollWidth > bas.clientWidth + 1 && fs > 12 && n++ < 40){ fs -= 0.5; wm.style.fontSize = fs + "px"; }
}
