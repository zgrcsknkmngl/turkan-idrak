name: Kaynaklari tara

on:
  schedule:
    # Saat başının kalabalığından uzak iki dakika: biri düşerse öteki yakalar
    - cron: '23,53 * * * *'
  push:
    # tara.js ya da bu dosya yüklenince tarama hemen kendiliğinden çalışır
    paths:
      - 'tara.js'
      - '.github/workflows/tara.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tara
  cancel-in-progress: false

jobs:
  tara:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Kaynaklari tara
        run: node tara.js
      - name: Git ayarla
        run: git config user.name "Turkan Idrak" && git config user.email "actions@users.noreply.github.com"
      - name: Kaydet ve gonder
        run: |
          git add -A
          if git diff --staged --quiet; then
            echo "degisiklik yok"
          else
            git commit -q -m "Akis guncellendi"
            git pull -q --rebase || true
            git push
          fi
