<style>
  :root{
    --ink:#0B1420;
    --raised:#121F2D;
    --rule:#20344A;
    --vellum:#E9E1D0;
    --dim:#8194AB;
    --ember:#E0343A;
    --gold:#3F91E4;

    --serif:"Newsreader",Georgia,serif;
    --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;

    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *,*::before,*::after{box-sizing:inherit}
  html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
  body{
    margin:0;min-height:100%;background:var(--ink);color:var(--vellum);
    font-family:var(--sans);font-size:16px;line-height:1.5;padding-bottom:78px;
  }
  button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
  a{color:inherit}
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:2px}

  .masthead{
    display:flex;align-items:center;gap:11px;padding:12px 18px 11px;
    border-bottom:1px solid var(--rule);
    position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ink);
  }
  .mark{width:34px;height:43.5px;flex:none}
  .wordmark{font-family:var(--serif);font-size:21px;font-weight:600;line-height:1}
  .wordmark em{font-style:normal;color:var(--gold)}
  .count{margin-left:auto;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}

  .rail{display:flex;gap:8px;overflow-x:auto;padding:11px 18px;
    border-bottom:1px solid var(--rule);scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .rail::-webkit-scrollbar{display:none}
  .chip{flex:none;padding:5px 12px;border:1px solid var(--rule);border-radius:999px;
    font-size:13px;color:var(--dim);white-space:nowrap}
  .chip[aria-pressed="true"]{border-color:var(--ember);color:var(--vellum);background:rgba(224,52,58,.16)}
  .chip .say{font-size:10.5px;opacity:.65;margin-left:5px;font-variant-numeric:tabular-nums}
  .chip.bos{opacity:.4}

  .arama{display:flex;align-items:center;gap:9px;padding:10px 18px;border-bottom:1px solid var(--rule)}
  .arama svg{width:17px;height:17px;flex:none;color:var(--dim)}
  .arama input{flex:1;min-width:0;background:none;border:none;color:var(--vellum);
    font-family:var(--sans);font-size:15px;padding:4px 0;outline:none}
  .arama input::placeholder{color:#5D6F88}
  .arama input::-webkit-search-cancel-button{display:none}
  .arama #qsil{flex:none;color:var(--dim);font-size:20px;line-height:1;padding:2px 6px}
  .etiketler{padding:9px 18px}
  .etiketler .chip{font-size:12.5px;padding:4px 11px}
  main{padding:0 18px}
  .entry{padding:19px 0;border-bottom:1px solid var(--rule)}
  .entry.okundu h2{color:#9BA9B9}
  .entry.okundu .sum{color:#7E8CA0}
  .cubuk{display:flex;gap:9px;align-items:center;padding:12px 0 2px;flex-wrap:wrap}
  .mini{border:1px solid var(--rule);border-radius:999px;padding:6px 14px;font-size:12.5px;color:var(--dim)}
  .mini[disabled]{opacity:.5}
  .uyari{font-size:12px;color:#E08878}
  .daha{padding:22px 0 10px;text-align:center}
  .daha .son{font-size:12px;color:#5D6F88}
  .entry:last-child{border-bottom:none}
  .meta{display:flex;align-items:baseline;gap:10px;margin-bottom:7px}
  .src{font-size:11.5px;font-weight:600;letter-spacing:.06em;color:var(--ember)}
  .yazar{font-size:11.5px;color:#94A3B4;font-style:italic;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;max-width:46%}
  .when{font-size:11.5px;color:var(--dim);margin-left:auto;font-variant-numeric:tabular-nums}
  .entry h2{font-family:var(--serif);font-weight:500;font-size:19px;line-height:1.32;margin:0 0 7px}
  .orig{font-size:13px;color:var(--dim);font-style:italic;margin:0 0 8px}
  .sum{font-family:var(--serif);font-size:15px;line-height:1.55;color:#BCC8D6;margin:0 0 12px}
  .acts{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
  .act{font-size:13px;color:var(--dim);display:flex;align-items:center;gap:5px}
  .act svg{width:15px;height:15px;flex:none}
  .act.on{color:var(--gold)}
  .act.busy{opacity:.5}

  .state{padding:52px 6px;text-align:center;color:var(--dim)}
  .state .mark{width:68px;height:87px;opacity:.85;margin:0 auto 20px}
  .state h3{font-family:var(--serif);font-weight:500;font-size:20px;color:var(--vellum);margin:0 0 10px}
  .state p{font-size:14.5px;margin:0 0 14px;line-height:1.6;max-width:33em;margin-left:auto;margin-right:auto}
  .state .go{border:1px solid var(--rule);padding:9px 18px;border-radius:999px;font-size:14px;color:var(--vellum);margin:6px 4px 0}
  .warn{color:#E49183;font-size:13px;line-height:1.55;padding:12px 0;border-bottom:1px solid var(--rule);margin-bottom:4px}

  .ac{display:block;width:100%;text-align:center;padding:12px;margin:16px 0 4px;
      border:1px solid var(--rule);border-radius:9px;font-size:14px;color:var(--dim)}
  .ac[aria-expanded="true"]{color:var(--vellum)}
  .srow{display:flex;align-items:center;gap:14px;padding:16px 2px;border-bottom:1px solid var(--rule)}
  .sinfo{min-width:0;flex:1}
  .durum{font-size:11.5px;color:var(--dim);margin-top:3px;display:flex;gap:9px;align-items:baseline}

  .durum .alan{color:#5D6F88;margin-left:auto;font-size:11px}
  .srow .nm{font-family:var(--serif);font-size:17px;line-height:1.25}
  .srow .tog{flex:none;width:42px;height:25px;border-radius:999px;background:var(--rule);position:relative}
  .srow .tog::after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:var(--dim)}
  .srow .tog[aria-pressed="true"]{background:rgba(224,52,58,.35)}
  .srow .tog[aria-pressed="true"]::after{left:20px;background:var(--ember)}
  .srow .del{flex:none;color:#4A5B71;font-size:20px;line-height:1;padding:4px 2px}
  .addbox{padding:14px 0 18px;border-bottom:1px solid var(--rule)}
  .addbox input{width:100%;background:var(--raised);border:1px solid var(--rule);color:var(--vellum);
    padding:11px 13px;border-radius:7px;font-size:15px;margin-bottom:9px;font-family:var(--sans)}
  .addbox input::placeholder{color:#5D6F88}
  .addbox .save{background:var(--ember);color:#fff;padding:10px 20px;border-radius:7px;font-size:14.5px;font-weight:500}
  .note{font-size:13px;color:var(--dim);line-height:1.65;padding:18px 0 4px}

  nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;
    background:var(--raised);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px)}
  nav button{flex:1;padding:11px 0 12px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--dim);font-size:11px}
  nav button svg{width:21px;height:21px}
  nav button[aria-current="page"]{color:var(--vellum)}
  nav button[aria-current="page"] svg{color:var(--ember)}

  @media (prefers-reduced-motion:no-preference){
    .entry{animation:rise .3s ease both}
    @keyframes rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
  }
</style>

<script>
"use strict";

/* RAND adresleri rand.org/news/rss.html sayfasından doğrulandı.
   Diğerleri doğrulanmadı — açılmayanı Kaynaklar ekranından düzelt. */
const VARSAYILAN = [];   // kaynaklar akis.json ile gelir

const YEREL = location.protocol === "file:" || location.protocol === "content:";

const S = {
  kaynaklar: yukle("ti.kaynaklar6", VARSAYILAN),
  kayitli:   yukle("ti.kayitli", []),
  ceviri:    yukle("ti.ceviri", {}),
  bellek:yukle("ti.bellek",{}),
  okunan:yukle("ti.okunan",[]),
  ara:"", etiket:"",
  goster:40,
  yazilar:[], hata:[], suzgec:"hepsi", ekran:"feed", yukleniyor:false
};

function yukle(k,v){ try{const x=localStorage.getItem(k);return x?JSON.parse(x):v}catch(e){return v} }
function yaz(k,v){
  try{ localStorage.setItem(k,JSON.stringify(v)); return true; }
  catch(e){
    try{ localStorage.removeItem("ti.bellek"); localStorage.setItem(k,JSON.stringify(v)); return true; }
    catch(e2){ S.dolu=true; return false; }
  }
}

const $ = s => document.querySelector(s);
const kac = s => (s||"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const temiz = s => (s||"").replace(/<[^>]*>/g," ").replace(/&nbsp;/gi," ")
  .replace(/&amp;/gi,"&").replace(/&#\d+;|&[a-z]+;/gi," ").replace(/\s+/g," ").trim();
function serpistir(liste){
  const sonuc=[], bekleyen=[];
  let son=null, ardisik=0;
  const ekle = y => {
    if(y.kaynak===son) ardisik++; else { son=y.kaynak; ardisik=1; }
    sonuc.push(y);
  };
  for(const y of liste){
    if(y.kaynak===son && ardisik>=2){ bekleyen.push(y); continue; }
    ekle(y);
    const i = bekleyen.findIndex(b=>b.kaynak!==son);
    if(i>-1) ekle(bekleyen.splice(i,1)[0]);
  }
  return sonuc.concat(bekleyen);
}

function bellektenTopla(){
  const acikAdlar = S.kaynaklar.filter(k=>k.acik).map(k=>k.ad);
  const hepsi = acikAdlar.flatMap(ad => (S.bellek[ad]||{}).yazilar || []);
  const zaman = y => { const d=new Date(String(y.tarih||"").replace(" ","T")); return isNaN(d)?0:d.getTime(); };
  hepsi.sort((a,b)=> zaman(b)-zaman(a));
  S.yazilar = serpistir(hepsi);
}

const sade = x => (x||"").toLocaleLowerCase("tr")
  .replace(/[ıİ]/g,"i").replace(/[şŞ]/g,"s").replace(/[ğĞ]/g,"g")
  .replace(/[üÜ]/g,"u").replace(/[öÖ]/g,"o").replace(/[çÇ]/g,"c")
  .replace(/[âÂ]/g,"a").replace(/[îÎ]/g,"i").replace(/[ûÛ]/g,"u");

const ETIKETLER = [
  {ad:"Türkiye",     k:["turkiye","turkey","turkish","ankara","erdogan","bosphorus"]},

const kimlik = u => "a"+Math.abs([...(u||"")].reduce((h,c)=>((h<<5)-h+c.charCodeAt(0))|0,0)).toString(36);

function nezaman(t){
  if(!t) return "";
  const d = new Date(String(t).replace(" ","T")); if(isNaN(d)) return "";
  const dk = Math.floor((Date.now()-d)/60000);
  if(dk < 1)  return "az önce";
  if(dk < 60) return dk+" dk önce";
  const sa = Math.floor(dk/60); if(sa < 24) return sa+" saat önce";
  const g = Math.floor(sa/24);
  if(g === 1) return "dün";
  if(g < 30)  return g+" gün önce";
  return d.toLocaleDateString("tr-TR",{day:"numeric",month:"long"});
}

/* ---------- Akış: kendi sunucumuzun ürettiği dosyadan ---------- */
async function akisiCek(){
  const c = await fetch("akis.json?t="+Date.now(), {cache:"no-store"});
  if(!c.ok) throw new Error("akis.json okunamadı (HTTP "+c.status+")");
  return c.json();
}

async function cek(){
  if(S.yukleniyor) return;
  S.yukleniyor=true; S.hata=[];

  bellektenTopla();
  const vardi = S.yazilar.length>0;
  if(!vardi && S.ekran==="feed"){
    cizSerit();
    $("#feed").innerHTML=`<div class="state">
      <svg class="mark" aria-hidden="true"><use href="#anka"/></svg>
      <p>akış alınıyor…</p></div>`;
  }
  const g=$("#tazele"); if(g) g.textContent="…";

  try{
    const veri = await akisiCek();
    S.guncellendi = veri.guncellendi;

    // sunucudan gelen kaynaklari listeye yerlestir
    for(const [ad, kayit] of Object.entries(veri.kaynaklar||{})){
      if(!S.kaynaklar.some(k=>k.ad===ad)) S.kaynaklar.push({ad, url:"", acik:true, sunucu:true});
      S.bellek[ad] = {yazilar:(kayit.yazilar||[]).slice(0,40), zaman:Date.parse(kayit.tarandi)||Date.now()};
      if(kayit.durum && kayit.durum!=="tamam") S.hata.push({ad, mesaj:kayit.durum});
    }
    yaz("ti.kaynaklar6", S.kaynaklar);
    yaz("ti.bellek", S.bellek);   // cevrimdisi icin kucuk kopya
  }catch(e){
    S.hata.push({ad:"Akış", mesaj:e.message});
  }

  bellektenTopla();
  S.yukleniyor=false;
  if(g) g.textContent="";
  ciz();
}

/* ---------- Çeviri ---------- */
async function cevir(m){
  if(!m) return "";
  const r = await fetch("https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=tr&dt=t&q="+encodeURIComponent(m));
  if(!r.ok) throw new Error("çeviri "+r.status);
  const j = await r.json();
  return (j[0]||[]).map(p=>p[0]).join("");
}
async function yaziyiCevir(id){
  const y = [...S.yazilar,...S.kayitli].find(x=>x.id===id);
  if(!y || S.ceviri[id]) return;
  const d = document.querySelector(`[data-cev="${id}"]`);
  if(d){ d.classList.add("busy"); d.lastElementChild.textContent = "çevriliyor…"; }
  try{
    const [b,o] = await Promise.all([cevir(y.baslik), cevir(y.ozet)]);
    S.ceviri[id] = {baslik:b, ozet:o};
    const an=Object.keys(S.ceviri); if(an.length>400) an.slice(0,an.length-400).forEach(x=>delete S.ceviri[x]);
    yaz("ti.ceviri", S.ceviri); ciz();
  }catch(e){
    if(d){ d.classList.remove("busy"); d.lastElementChild.textContent = "çeviri kapalı"; }
  }
}

async function hepsiniCevir(){
  if(S.topluCeviri) return;
  const liste = (S.suzgec==="hepsi" ? S.yazilar : S.yazilar.filter(y=>y.kaynak===S.suzgec))
                  .filter(y=>!S.ceviri[y.id]);
  if(!liste.length) return;
  S.topluCeviri=true; ciz();
  for(let i=0;i<liste.length;i++){
    const y=liste[i];
    try{
      const [b,o]=await Promise.all([cevir(y.baslik), cevir(y.ozet)]);
      S.ceviri[y.id]={baslik:b,ozet:o};
    }catch(e){ S.topluCeviri=false; yaz("ti.ceviri",S.ceviri); ciz(); return; }
    S.topluKalan=liste.length-i-1;
    if(i%4===3) ciz();
    await new Promise(r=>setTimeout(r,120));
  }
  S.topluCeviri=false; S.topluKalan=0;
  yaz("ti.ceviri", S.ceviri); ciz();
}

/* ---------- Kaydetme ---------- */
function kaydet(id){
  const i = S.kayitli.findIndex(x=>x.id===id);
  if(i > -1) S.kayitli.splice(i,1);
  else { const y = S.yazilar.find(x=>x.id===id); if(y) S.kayitli.unshift(y); }
  if(S.kayitli.length>300) S.kayitli.length=300;
  yaz("ti.kayitli", S.kayitli); ciz();
}
const kayitliMi = id => S.kayitli.some(x=>x.id===id);

async function paylas(id, dugme){
  const y = [...S.yazilar, ...S.kayitli].find(x=>x.id===id);
  if(!y) return;
  const c = S.ceviri[id];
  const baslik = c ? c.baslik : y.baslik;
  const metin = baslik + "\n" + y.kaynak + "\n" + y.link;
  try{
    if(navigator.share){ await navigator.share({title:baslik, text:baslik+" — "+y.kaynak, url:y.link}); return; }
    await navigator.clipboard.writeText(metin);
    if(dugme){ const e=dugme.lastElementChild; e.textContent="kopyalandı"; setTimeout(()=>e.textContent="paylaş",1600); }
  }catch(e){ /* kullanici vazgecti */ }
}
function okunduIsaretle(id){
  if(S.okunan.includes(id)) return;
  S.okunan.push(id);
  if(S.okunan.length>600) S.okunan.splice(0,S.okunan.length-600);
  yaz("ti.okunan", S.okunan);
}

/* ---------- Çizim ---------- */
const I = {
  yer:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 4h12v17l-6-4.2L6 21z"/></svg>',
  yerD:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h12v17l-6-4.2L6 21z"/></svg>',
  dil:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 3 2.6 15 0 18M12 3c-2.6 3-2.6 15 0 18"/></svg>',
  dis:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 4h6v6M20 4l-8.5 8.5M18 14v5a1 1 0 01-1 1H5a1 1 0 01-1-1V7a1 1 0 011-1h5"/></svg>',
  pay:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="18" cy="5" r="2.6"/><circle cx="6" cy="12" r="2.6"/><circle cx="18" cy="19" r="2.6"/><path d="M8.4 10.8l7.2-4.2M8.4 13.2l7.2 4.2"/></svg>'
};

function kart(y){
  const c = S.ceviri[y.id];
  const k = kayitliMi(y.id);
  return `<article class="entry${S.okunan.includes(y.id)?" okundu":""}">
    <div class="meta"><span class="src">${kac(y.kaynak)}</span>${
      y.yazar ? `<span class="yazar">${kac(y.yazar)}</span>` : ""
    }<span class="when">${nezaman(y.tarih)}</span></div>
    <h2>${kac(c ? c.baslik : y.baslik)}</h2>
    ${c ? `<p class="orig">${kac(y.baslik)}</p>` : ""}
    ${(c?c.ozet:y.ozet) ? `<p class="sum">${kac(c?c.ozet:y.ozet)}</p>` : ""}
    <div class="acts">
      <button class="act ${k?"on":""}" data-kay="${y.id}">${k?I.yerD:I.yer}<span>${k?"kayıtlı":"kaydet"}</span></button>
      ${c ? "" : `<button class="act" data-cev="${y.id}">${I.dil}<span>çevir</span></button>`}
      <a class="act" href="${kac(y.link)}" target="_blank" rel="noopener" data-oku="${y.id}">${I.dis}<span>kaynak</span></a>
      <button class="act" data-pay="${y.id}">${I.pay}<span>paylaş</span></button>
    </div></article>`;
}

function ciz(){
  $("#rail").classList.toggle("hide", S.ekran!=="feed");
  $("#arama").classList.toggle("hide", S.ekran!=="feed");
  $("#etiketler").classList.toggle("hide", S.ekran!=="feed");
  if(S.ekran==="feed"){ cizSerit(); cizEtiketler(); }
  $("#feed").classList.toggle("hide", S.ekran!=="feed");
  $("#saved").classList.toggle("hide", S.ekran!=="saved");
  $("#sources").classList.toggle("hide", S.ekran!=="sources");
  ["feed","saved","sources"].forEach(e=>$("#nav-"+e).setAttribute("aria-current", S.ekran===e?"page":"false"));
  if(S.ekran==="feed") cizAkis();
  if(S.ekran==="saved") cizKayitli();
  if(S.ekran==="sources") cizKaynaklar();
}

function cizEtiketler(){
  const e=$("#etiketler");
  if(!e.dataset.hazir){
    e.innerHTML = ETIKETLER.map(x=>
      `<button class="chip" data-etiket="${kac(x.ad)}">${kac(x.ad)}</button>`).join("");
    e.dataset.hazir="1";
  }
  [...e.children].forEach(b=>b.setAttribute("aria-pressed", b.dataset.etiket===S.etiket));
}

function cizSerit(){
  const acik = S.kaynaklar.filter(k=>k.acik).slice().sort((a,b)=>a.ad.localeCompare(b.ad,"tr"));
  const say = a => S.yazilar.filter(y=>y.kaynak===a).length;
  $("#rail").innerHTML =
    `<button class="chip" data-suz="hepsi" aria-pressed="${S.suzgec==="hepsi"}">Tümü<span class="say">${S.yazilar.length}</span></button>` +
    acik.map(k=>{
      const n = say(k.ad);
      return `<button class="chip ${n?"":"bos"}" data-suz="${kac(k.ad)}" aria-pressed="${S.suzgec===k.ad}">${kac(k.ad)}<span class="say">${n}</span></button>`;
    }).join("");
}

function cizAkis(){
  if(S.yukleniyor) return;
  let liste = S.suzgec==="hepsi" ? S.yazilar : S.yazilar.filter(y=>y.kaynak===S.suzgec);

  if(S.etiket){
    const e = ETIKETLER.find(x=>x.ad===S.etiket);
    if(e) liste = liste.filter(y=>{
      const m = " "+sade(y.baslik+" "+y.ozet+" "+((S.ceviri[y.id]||{}).baslik||"")+" "+((S.ceviri[y.id]||{}).ozet||""))+" ";
      return e.k.some(w=>m.includes(sade(w)));
    });
  }
  if(S.ara.trim()){
    const kelimeler = sade(S.ara).split(/\s+/).filter(Boolean);
    liste = liste.filter(y=>{
      const m = sade(y.baslik+" "+y.ozet+" "+y.kaynak+" "+((S.ceviri[y.id]||{}).baslik||"")+" "+((S.ceviri[y.id]||{}).ozet||""));
      return kelimeler.every(w=>m.includes(w));
    });
  }
  $("#count").textContent = S.yazilar.length
    ? S.kaynaklar.filter(k=>k.acik).length+" kaynak · "+S.yazilar.length+" yazı"
    : "";

  if(!liste.length){
    if(S.ara.trim() || S.etiket){
      $("#feed").innerHTML = `<div class="state">
        <svg class="mark" aria-hidden="true"><use href="#anka"/></svg>
        <h3>Sonuç yok</h3>
        <p>${S.etiket ? kac(S.etiket)+" etiketiyle" : "“"+kac(S.ara)+"” aramasıyla"} eşleşen yazı bulunamadı.</p>
        <button class="go" data-sifirla="1">Aramayı temizle</button></div>`;
      return;
    }
    const tekKaynak = S.suzgec!=="hepsi";
    $("#feed").innerHTML = `<div class="state">
      <svg class="mark" aria-hidden="true"><use href="#anka"/></svg>
      <h3>${tekKaynak ? kac(S.suzgec)+" açılmadı" : (YEREL ? "Dosya telefonda yerel açıldı" : "Hiçbir kaynak açılmadı")}</h3>
      <p>${tekKaynak
        ? "Bu kaynağın besleme adresi yanıt vermedi. Nedenini Kaynaklar ekranında görebilirsin."
        : (YEREL
          ? "Tarayıcı, indirilmiş bir dosyanın dışarıdan veri çekmesini güvenlik gereği engelliyor. Uygulamanın çalışması için sayfanın bir adreste yayında olması gerekiyor."
          : "Besleme adresleri değişmiş olabilir. Kaynaklar ekranından adresleri düzeltip yeniden dene.")}</p>
      <button class="go" data-yeni="1">Yeniden dene</button>
      <button class="go" data-git="sources">Kaynaklar</button>
      ${S.hata.length ? `<p class="warn" style="text-align:left;margin-top:26px;font-size:12px;line-height:1.6">${
        S.hata.map(h=>"<strong>"+kac(h.ad)+"</strong> — "+kac(h.mesaj)).join("<br>")}</p>` : ""}
      </div>`;
    return;
  }
  const cevrilmemis = liste.filter(y=>!S.ceviri[y.id]).length;
  const cubuk = `<div class="cubuk">
      <button class="mini" data-yeni="1"${S.yukleniyor?" disabled":""}>${S.yukleniyor?"yenileniyor…":"yenile"}</button>
      ${cevrilmemis ? `<button class="mini" data-toplu="1"${S.topluCeviri?" disabled":""}>${
          S.topluCeviri ? "çevriliyor… "+(S.topluKalan||0) : "hepsini çevir ("+cevrilmemis+")"}</button>` : ""}
      ${S.dolu ? `<span class="uyari">depo doldu</span>` : ""}
    </div>`;
  const parca = liste.slice(0, S.goster);
  const kalan = liste.length - parca.length;
  const dahaFazla = kalan
    ? `<div class="daha"><button class="mini" data-daha="1">daha eski yazılar (${kalan})</button></div>`
    : (liste.length>40 ? `<div class="daha"><span class="son">arşivin sonu — ${liste.length} yazı</span></div>` : "");
  $("#feed").innerHTML = cubuk + parca.map(kart).join("") + dahaFazla;
}

function cizKayitli(){
  $("#count").textContent = S.kayitli.length ? S.kayitli.length+" kayıt" : "";
  $("#saved").innerHTML = S.kayitli.length ? S.kayitli.map(kart).join("")
    : `<div class="state"><svg class="mark" aria-hidden="true"><use href="#anka"/></svg>
       <h3>Henüz kayıt yok</h3>
       <p>Akıştaki bir yazının altındaki <strong>kaydet</strong>e dokun, burada birikir.</p>
       <button class="go" data-git="feed">Akışa dön</button></div>`;
}

function cizKaynaklar(){
  $("#count").textContent="";
  const hataVar = ad => S.hata.some(h=>h.ad===ad);
  const say = ad => S.yazilar.filter(y=>y.kaynak===ad).length;
  const alan = u => { try{ return new URL(u).hostname.replace(/^www\./,""); }catch(e){ return u; } };
  const arsiv = ad => ((S.bellek[ad]||{}).yazilar||[]).length;

  $("#sources").innerHTML = `
    <p class="note" style="padding-top:14px">${S.guncellendi
      ? "Akış sunucuda son olarak "+new Date(S.guncellendi).toLocaleString("tr-TR",{day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"})+" tarandı."
      : "Akış henüz alınmadı."}</p>
    ${S.kaynaklar.map((k,i)=>{
      const n=say(k.ad), bozuk=k.acik&&hataVar(k.ad);
      return `<div class="srow">
        <div class="sinfo">
          <div class="nm">${kac(k.ad)}</div>
          <div class="durum${bozuk?" kirik":""}">${
            !k.acik ? "kapalı" : bozuk ? (arsiv(k.ad)? "ulaşılamadı · "+arsiv(k.ad)+" yazı duruyor" : "ulaşılamadı") : (n?n+" yazı":"—")
          }${k.url?`<span class="alan">${kac(alan(k.url))}</span>`:""}</div>
        </div>
        <button class="tog" data-ac="${i}" aria-pressed="${!!k.acik}" aria-label="${kac(k.ad)}"></button>
        ${k.sunucu ? "" : `<button class="del" data-sil="${i}" aria-label="${kac(k.ad)} sil">×</button>`}
      </div>`;
    }).join("")}`;
}

/* ---------- Olaylar ---------- */
document.addEventListener("click", e=>{
  const t = e.target.closest("[data-kay],[data-cev],[data-suz],[data-git],[data-ac],[data-sil],[data-yeni],[data-oku],[data-toplu],[data-daha],[data-etiket],[data-sifirla],[data-pay],#ekle,#ekleAc");
  if(!t) return;
  if(t.dataset.oku){ okunduIsaretle(t.dataset.oku); t.closest(".entry").classList.add("okundu"); return; }
  if(t.dataset.pay) return paylas(t.dataset.pay, t);
  if(t.dataset.kay) return kaydet(t.dataset.kay);
  if(t.dataset.cev) return yaziyiCevir(t.dataset.cev);
  if(t.dataset.yeni) return cek();
  if(t.dataset.toplu) return hepsiniCevir();
  if(t.dataset.daha){ S.goster+=40; cizAkis(); return; }
  if(t.dataset.etiket){
    S.etiket = S.etiket===t.dataset.etiket ? "" : t.dataset.etiket;
    S.ara=""; $("#q").value=""; $("#qsil").classList.add("hide");
    S.goster=40; ciz(); scrollTo({top:0}); return;
  }
  if(t.dataset.sifirla){
    S.ara=""; S.etiket=""; $("#q").value=""; $("#qsil").classList.add("hide");
    S.goster=40; ciz(); return;
  }
  if(t.id==="ekleAc"){ S.ekleAcik=!S.ekleAcik; ciz(); return; }
  if(t.dataset.suz){ S.suzgec=t.dataset.suz; S.goster=40; ciz(); scrollTo({top:0}); return; }
  if(t.dataset.git){ S.ekran=t.dataset.git; ciz(); return; }
  if(t.dataset.ac !== undefined){
    const k=S.kaynaklar[+t.dataset.ac]; k.acik=!k.acik;
    yaz("ti.kaynaklar6",S.kaynaklar); bellektenTopla(); ciz(); return;
  }
  if(t.dataset.sil !== undefined){
    const k=S.kaynaklar[+t.dataset.sil];
    if(!confirm(k.ad+" kaynağı silinsin mi?")) return;
    delete S.bellek[k.ad];
    S.kaynaklar.splice(+t.dataset.sil,1); yaz("ti.kaynaklar6",S.kaynaklar); ciz(); cek(); return;
  }
  if(t.id === "ekle"){
    const ad=$("#ad").value.trim(), url=$("#url").value.trim();
    if(!ad||!url) return;
    S.kaynaklar.push({ad,url,acik:true}); yaz("ti.kaynaklar6",S.kaynaklar); ciz(); cek();
  }
});
["feed","saved","sources"].forEach(e=>
  $("#nav-"+e).addEventListener("click",()=>{ S.ekran=e; S.goster=40; ciz(); scrollTo({top:0}); }));

/* asagi cekip birakinca yenile */
let cekBas=0, cekAktif=false;
addEventListener("touchstart",e=>{ cekBas = scrollY<=0 ? e.touches[0].clientY : 0; cekAktif=false; },{passive:true});
addEventListener("touchmove",e=>{
  if(!cekBas || S.yukleniyor || S.ekran!=="feed") return;
  if(e.touches[0].clientY-cekBas > 90) cekAktif=true;
},{passive:true});
addEventListener("touchend",()=>{ if(cekAktif){ cekAktif=false; cekBas=0; cek(); } });

let qSayac;
$("#q").addEventListener("input", e=>{
  const v=e.target.value;
  $("#qsil").classList.toggle("hide", !v);
  clearTimeout(qSayac);
  qSayac=setTimeout(()=>{ S.ara=v; if(v) S.etiket=""; S.goster=40; ciz(); }, 220);
});
$("#qsil").addEventListener("click", ()=>{
  $("#q").value=""; $("#qsil").classList.add("hide");
  S.ara=""; S.goster=40; ciz(); $("#q").focus();
});

bellektenTopla();
ciz();
cek();
</script>
