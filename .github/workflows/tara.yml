name: Kaynaklari tara

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tara:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Kaynaklari tara
        run: node tara.js
      - name: Git ayarla
        run: git config user.name "Turkan Idrak" && git config user.email "actions@users.noreply.github.com"
      - name: Kaydet ve gonder
        run: git add akis.json && (git diff --staged --quiet && echo "degisiklik yok" || (git commit -m "Akis guncellendi" && git push))
